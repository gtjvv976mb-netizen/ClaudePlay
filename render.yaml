# One-click hosting on Render: https://render.com/deploy?repo=https://github.com/gtjvv976mb-netizen/GamePlay
# Render asks for ANTHROPIC_API_KEY when you create the service; it is stored in Render, never in this repo.
services:
  - type: web
    name: gameplay
    runtime: node
    # Free: the instance sleeps after 15 minutes without visitors and takes about a minute to wake.
    # Published games are kept in a free Upstash Redis database (below), because free instances have no disk.
    plan: free
    buildCommand: npm ci && node build.mjs
    startCommand: npm start
    healthCheckPath: /api/status
    # Your own domain (DNS steps in the README). Render adds www.claudeplay.si and redirects it here.
    domains:
      - claudeplay.si
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
      # From your free Upstash Redis database (console.upstash.com → your database → REST API).
      # Without them, published games are lost whenever the free instance restarts.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # A random secret; the service log prints your owner link (settle rewards, delist games).
      - key: GP_ADMIN_KEY
        generateValue: true
      # Render overwrites the first X-Forwarded-For entry with the real visitor address.
      - key: GP_TRUST_PROXY
        value: "1"
      # Free plan: new games per visitor per day, built by Claude Sonnet 5.5 (about $0.20-0.40 a game).
      - key: GP_DAILY_BUILDS
        value: "2"
      # Free new games per day across the whole site, so a public link cannot run up your API bill.
      - key: GP_DAILY_TOTAL
        value: "40"
      # Free plan: changes to a game per visitor per day, on Claude Haiku 5.5 (about $0.02 each), and the site-wide cap.
      - key: GP_DAILY_EDITS
        value: "20"
      - key: GP_DAILY_EDIT_TOTAL
        value: "300"
      # Pro pass: paid in SOL from the player's wallet straight to GP_TREASURY. Unlocks Claude Sonnet 5.5
      # "best" builds, GP_PRO_BUILDS new games and GP_PRO_EDITS changes a day for GP_PRO_DAYS days. Needs GP_TREASURY; 0 turns Pro off.
      - key: GP_PRO_PRICE_SOL
        value: "0.1"
      - key: GP_PRO_DAYS
        value: "30"
      - key: GP_PRO_BUILDS
        value: "10"
      - key: GP_PRO_EDITS
        value: "60"
      # Collects and tips are real Solana payments on this network. Devnet uses free test SOL.
      # Mainnet (real money) also needs GP_ALLOW_MAINNET=yes, and only after the checklist in SECURITY.md.
      - key: GP_SOLANA_CLUSTER
        value: devnet
      # The public address of a wallet you control; it receives the 5% protocol fee. Never a secret key.
      # Left blank, the site uses the simulated ledger until you set it.
      - key: GP_TREASURY
        sync: false
