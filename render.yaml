# One-click hosting on Render: https://render.com/deploy?repo=https://github.com/gtjvv976mb-netizen/GamePlay
# Render asks for ANTHROPIC_API_KEY when you create the service; it is stored in Render, never in this repo.
services:
  - type: web
    name: gameplay
    runtime: node
    # The shared gallery lives on a persistent disk, which needs a paid instance (Starter).
    # For a free trial, change this to "free" and delete the disk block: games then reset on every deploy.
    plan: starter
    buildCommand: npm ci && node build.mjs
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: gameplay-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: GP_DATA_DIR
        value: /var/data
      # A random secret; the service log prints your owner link (settle rewards, delist games).
      - key: GP_ADMIN_KEY
        generateValue: true
      # Render overwrites the first X-Forwarded-For entry with the real visitor address.
      - key: GP_TRUST_PROXY
        value: "1"
      - key: GP_DAILY_BUILDS
        value: "12"
      # Builds per day across the whole site, so a public link cannot run up your API bill.
      - key: GP_DAILY_TOTAL
        value: "300"
      # Collects and tips are real Solana payments on this network. Devnet uses free test SOL.
      # Mainnet (real money) also needs GP_ALLOW_MAINNET=yes, and only after the checklist in SECURITY.md.
      - key: GP_SOLANA_CLUSTER
        value: devnet
      # The public address of a wallet you control; it receives the 5% protocol fee. Never a secret key.
      # Left blank, the site uses the simulated ledger until you set it.
      - key: GP_TREASURY
        sync: false
