* { box-sizing: border-box; }
html { scrollbar-color: var(--shell-dark) var(--bg); }
::selection { background: var(--accent-soft); color: var(--ink); }
input, textarea { caret-color: var(--accent); }
body { background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 60%, transparent); text-decoration-thickness: 1px; text-underline-offset: .2em; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
.mono { font-family: var(--mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: .875rem; }
.eyebrow { font: 500 .875rem/1.3 var(--body); color: var(--muted); }
.display { font-family: var(--display); font-weight: 600; letter-spacing: -.02em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.linkish { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: .14em; text-underline-offset: .2em; cursor: pointer; font: inherit; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r-s); font-weight: 600; text-decoration: none; }
.skip:focus { top: calc(10px + env(safe-area-inset-top, 0px)); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 10px; min-height: 32px; text-decoration: none; color: var(--ink); }
.mark b { display: inline-flex; align-items: center; gap: 8px; font: 600 1.1875rem/1 var(--display); letter-spacing: -.02em; color: var(--ink); }
.mark b::before { content: ""; width: 20px; height: 20px; border-radius: 6px; background: var(--pack); box-shadow: inset 0 0 0 5px var(--pack), inset 0 0 0 7px var(--pack-ink-2); flex: none; }
.mark span { font: 500 .75rem/1 var(--body); color: var(--muted); padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 3px; }
.nav::-webkit-scrollbar { display: none; }
.nav a { position: relative; padding: 8px 14px; font-weight: 500; font-size: .9375rem; color: var(--ink-2); text-decoration: none; border-radius: 999px; white-space: nowrap; transition: background-color .2s, color .2s; }
.nav a:hover { color: var(--ink); background: var(--panel-2); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 2px 6px -2px var(--shadow); }
.hbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; min-height: 38px; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: 500 .8125rem var(--body); color: var(--ink); }
.hbtn:hover { background: var(--panel); }
.hbtn.on { border-color: var(--accent); color: var(--accent); }
.hbtn svg { width: 18px; height: 18px; flex: none; }
.wchip { display: flex; align-items: center; gap: 10px; min-height: 38px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 14px; cursor: pointer; font: 500 .8125rem var(--body); color: var(--ink); }
.wchip .addr { font: 500 .75rem var(--mono); }
.wchip .bal { display: flex; gap: 10px; font: 500 .75rem var(--mono); color: var(--ink-2); }
.wchip .bal span { display: inline-flex; align-items: center; gap: 4px; }
.ico { width: 14px; height: 14px; flex: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.dot.off { background: var(--muted); }
@media (max-width: 900px) {
  .top-in { gap: 8px 10px; padding-block: 10px 4px; }
  .hbtn { order: 2; }
  .wchip { order: 2; }
  .nav { order: 3; width: 100%; margin-inline: -6px; }
  .wchip .bal span:nth-child(3) { display: none; }
}
@media (max-width: 520px) {
  .top-in { padding-inline: 16px; gap: 8px; }
  .mark b { font-size: 1.1875rem; }
  .hbtn { margin-left: auto; padding: 6px 9px; }
  .wchip { padding-inline: 9px; }
  .mark span { display: none; }
  .hbtn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wchip .bal span:nth-child(2) { display: none; }
}

/* ---------- page frame ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 72px; }
.wrap:focus { outline: none; }
@media (max-width: 560px) { .wrap { padding-inline: 16px; padding-block: 16px 64px; } }
.section { display: grid; gap: 18px; margin-top: 88px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.section-head h2, .h2 { font: 600 clamp(1.625rem, 2.6vw, 2.25rem)/1.1 var(--display); letter-spacing: -.025em; }
.section-head a { font-weight: 700; }
.section-head p { flex-basis: 100%; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-l); padding: 22px; min-width: 0; box-shadow: 0 1px 2px var(--shadow), 0 12px 32px -20px var(--shadow); }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.split { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.lede { font-size: 1.125rem; max-width: 36em; color: var(--ink-2); }

/* ---------- footer ---------- */
.foot { margin-top: 96px; padding: 26px 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px 40px; color: var(--muted); font-size: .875rem; }
.foot-main { display: grid; gap: 8px; max-width: 46em; justify-items: start; }
.foot-mark { font: 600 1.0625rem/1 var(--display); letter-spacing: -.02em; color: var(--ink); }
.foot-links { display: flex; flex-wrap: wrap; gap: 8px 18px; align-content: start; justify-content: flex-end; }
.foot-links a, .foot-links .linkish { font-weight: 700; color: var(--ink); }
.foot-status { grid-column: 1 / -1; font-size: .8125rem; }
@media (max-width: 760px) { .foot { grid-template-columns: 1fr; } .foot-links { justify-content: flex-start; } }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 .9375rem/1.1 var(--body); cursor: pointer; text-decoration: none; white-space: nowrap; box-shadow: 0 1px 2px var(--shadow); transition: transform .3s cubic-bezier(.32, .72, 0, 1), background-color .2s, border-color .2s, box-shadow .3s; }
.btn:hover { background: var(--panel-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--pack); border-color: var(--pack); color: var(--pack-ink); box-shadow: 0 1px 2px var(--shadow), 0 8px 20px -10px var(--shadow); }
.btn.primary:hover { background: var(--pack); transform: translateY(-1px); box-shadow: 0 2px 4px var(--shadow), 0 14px 28px -12px var(--shadow); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.small { min-height: 34px; padding: 7px 12px; font-size: .8125rem; }
.btn.big { min-height: 52px; padding: 14px 22px; font-size: 1.0625rem; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 .78125rem/1 var(--body); padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); background: var(--panel); white-space: nowrap; }
.pics { display: grid; gap: 8px; }
.pic { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--panel); }
.pic img { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; }
.pic input { min-width: 0; font-family: var(--mono); }
.chip.ok { color: var(--good); border-color: currentColor; }
.chip.bad { color: var(--bad); border-color: currentColor; }
.chip.gold { color: var(--gold); border-color: currentColor; }
.chip.accent { color: var(--accent); border-color: currentColor; }
button.chip { cursor: pointer; min-height: 32px; }
button.chip:hover { border-color: var(--ink-2); color: var(--ink); }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); }
.stack > .seg { justify-self: start; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 2px 6px -2px var(--shadow); }
label.field { display: grid; gap: 6px; font-weight: 500; font-size: .875rem; }
label.field small { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="number"], textarea, select { width: 100%; font: 400 .9375rem/1.4 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; }
textarea { resize: vertical; min-height: 92px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 18px; height: 18px; }
.knob { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: .875rem; }
.knob input { grid-column: 1 / -1; }
.knob output { font: 500 .75rem var(--mono); color: var(--muted); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 40px; height: 30px; border-radius: var(--r-s); border: 2px solid transparent; cursor: pointer; padding: 0; position: relative; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }
.swatch.custom .plus { position: absolute; right: 2px; bottom: 0; font: 800 .875rem/1 var(--body); color: #fff; text-shadow: 0 1px 2px #000; }
.brand-fields { display: flex; flex-wrap: wrap; gap: 10px 16px; }
label.color { display: inline-flex; align-items: center; gap: 8px; font-size: .875rem; font-weight: 700; }
label.color input { width: 44px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }

/* ---------- tiles: game art in a hairline frame ---------- */
/* (.sticker is the historical class name for a game's art tile.) */
.sticker { position: relative; display: block; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m);
  box-shadow: 0 1px 2px var(--shadow), 0 10px 24px -16px var(--shadow); transition: transform .3s cubic-bezier(.16, 1, .3, 1), border-color .2s, box-shadow .3s; }
.sticker img { display: block; width: 100%; height: auto; }
/* On hover a light sweep crosses the art, like a reflection on a cabinet screen. */
.sticker::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .12) 50%, transparent 65%); translate: -120% 0; transition: translate .7s cubic-bezier(.16, 1, .3, 1); pointer-events: none; }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } }
@keyframes rise { from { opacity: 0; transform: translateY(.35em); } }

/* ---------- the front page: a cabinet over the background game ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 40px; align-items: center; padding-top: 8px; }
.hero-copy { display: grid; gap: 18px; min-width: 0; justify-items: start; }
.hero-title { font: 600 clamp(2.5rem, 5vw, 4rem)/1.02 var(--display); letter-spacing: -.035em; }
.hero-title span { display: block; }
.page-title { font: 600 clamp(2rem, 4vw, 3.25rem)/1.05 var(--display); letter-spacing: -.03em; }
.hero .cta { margin-top: 2px; }
.ticks { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 18px; font-weight: 500; font-size: .9375rem; }
.ticks li { display: inline-flex; align-items: center; gap: 8px; }
.ticks li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.ticks.small { display: grid; gap: 8px; font-weight: 400; font-size: .9375rem; }
.ticks.small li { align-items: baseline; }
@media (max-width: 960px) { .hero { grid-template-columns: 1fr; gap: 28px; } }

/* The background game (.world) fills the window; the copy, the console and the game rail sit on solid surfaces over it,
   and the open middle column is where the kart races. */
.world { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; background: var(--bg); }
.world[hidden] { display: none; }
#view > .pack, #view > .foot-mini { position: relative; z-index: 1; }
:root[data-route="home"] .wrap { overflow-x: clip; }
@media (min-width: 961px) { :root[data-route="home"] .top-in { max-width: 1480px; } }
.pack { --px: 0; --py: 0; position: relative; isolation: isolate; color: var(--ink); padding: 8px 0 4px; gap: 18px 28px; align-items: center;
  grid-template-columns: minmax(0, 28rem) minmax(0, 1fr) minmax(0, 30rem); grid-template-rows: minmax(0, 1fr) auto; }
.pack .hero-copy { grid-column: 1; position: relative; gap: 14px; background: var(--die); color: var(--die-ink); border: 1px solid var(--line); border-radius: var(--r-l); padding: 28px 28px 22px;
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--die) 55%, transparent), 0 0 0 7px var(--line), 0 30px 60px -30px var(--shadow); animation: pop .6s cubic-bezier(.16, 1, .3, 1) backwards;
  translate: calc(var(--px) * -10px) calc(var(--py) * -6px); transition: translate .6s cubic-bezier(.16, 1, .3, 1); }
.pack .stage3d { grid-column: 3; }
.pack .lede { color: var(--die-ink-2); font-size: 1.0625rem; max-width: 30em; }
.pack .fine { color: var(--die-ink-2); }
.pack .hero-title { color: var(--die-ink); font-size: clamp(2.5rem, min(4.2vw, 7vh), 4.25rem); }
.pack .hero-title .hl { display: inline-block; color: var(--accent); }
.pack a:not(.btn) { color: var(--die-ink); text-decoration-color: var(--accent); }
/* Depth: every layer in the stage moves with the pointer by its own depth --d (calm motion leaves them still). */
.stage3d { position: relative; min-width: 0; align-self: center; width: min(100%, calc((100dvh - 400px) * 1.55)); justify-self: center; }
.mascot { position: absolute; z-index: 2; top: 0; right: 4%; width: clamp(96px, min(11vw, 17vh), 162px); height: auto; translate: calc(var(--px) * 40px) calc(-60% + var(--py) * 30px); pointer-events: none; user-select: none;
  filter: drop-shadow(0 10px 14px var(--shadow)); transition: translate .5s cubic-bezier(.16, 1, .3, 1); animation: pop .7s cubic-bezier(.16, 1, .3, 1) 1s backwards; }
.pack .console { transform: perspective(1800px) rotateY(calc(var(--px) * 4deg - 1.5deg)) rotateX(calc(var(--py) * -3deg + .5deg)); transition: transform .9s cubic-bezier(.32, .72, 0, 1);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--die) 55%, transparent), 0 0 0 7px var(--line), 0 30px 60px -28px var(--shadow); animation: console-in 1s cubic-bezier(.16, 1, .3, 1) .1s backwards; }
.pack .console .screen { animation: power-on .7s cubic-bezier(.2, .9, .2, 1) .7s backwards; }
@keyframes console-in { from { opacity: 0; transform: perspective(1800px) rotateY(-10deg) translate3d(30px, 20px, -60px); } }
@keyframes power-on { from { opacity: 0; } }
.pack .hero-title span { animation: rise .7s cubic-bezier(.16, 1, .3, 1) .1s backwards; }
.pack .hero-title span:nth-child(2) { animation-delay: .17s; }
.pack .hero-title .hl { animation: pop .6s cubic-bezier(.16, 1, .3, 1) .3s backwards; }
.maker { display: grid; gap: 10px; width: 100%; }
.maker-box { background: var(--sheet); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-m); padding: 6px 6px 8px; display: grid; gap: 4px; transition: border-color .2s, box-shadow .2s; }
.maker-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.maker-box textarea { border: 0; background: transparent; color: var(--ink); resize: none; min-height: 0; padding: 10px 12px 4px; font-size: 1.0625rem; line-height: 1.45; }
.maker-box textarea:focus { outline: none; }
.maker-box textarea::placeholder { color: var(--muted); }
.maker-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 0 4px; }
.maker-bar .seg { background: transparent; }
.maker-bar .seg button { padding: 7px 13px; font-size: .875rem; }
.maker-bar .btn { min-height: 46px; padding-inline: 20px; font-size: 1rem; }
.maker-ideas { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 3px 2px; mask-image: linear-gradient(90deg, #000 88%, transparent); }
.maker-ideas::-webkit-scrollbar { display: none; }
.maker-ideas .fine { flex: none; margin-right: 2px; font-weight: 500; }
.pack .maker-ideas .chip { flex: none; background: transparent; font-size: .8125rem; padding: 7px 11px; transition: border-color .15s, color .15s; }
.pack .maker-ideas .chip:hover { border-color: var(--ink-2); color: var(--ink); }
/* The rail of games along the bottom. */
.pack-shelf { grid-column: 1 / -1; display: grid; gap: 8px; min-width: 0; }
.pack-shelf-head { display: flex; align-items: baseline; gap: 14px; justify-self: start; background: var(--die); color: var(--die-ink); border: 1px solid var(--line); border-radius: 999px; padding: 5px 16px 4px; box-shadow: 0 1px 2px var(--shadow); }
.pack-shelf-head h2 { font: 600 1rem/1.2 var(--display); letter-spacing: -.01em; }
.pack-shelf-head a { font-weight: 500; font-size: .875rem; display: inline-block; padding-block: 4px; }
.pack .shelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); grid-template-columns: none; gap: 14px; overflow-x: auto; scrollbar-width: none; padding: 8px 4px 4px; margin: -8px -4px 0; }
.pack .shelf::-webkit-scrollbar { display: none; }
.pack .cart { gap: 0; }
.pack .cart .sticker { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 0; }
.pack .cart .sticker img { width: 100%; height: clamp(64px, 11.5vh, 112px); object-fit: cover; }
.pack .cart:hover .sticker, .pack .cart:focus-visible .sticker { transform: none; }
.pack .cart-title { font-size: .875rem; background: var(--die); color: var(--die-ink); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--r-m) var(--r-m); padding: 6px 10px 5px; }
.pack .cart:hover .cart-title, .pack .cart:focus-visible .cart-title { color: var(--accent); }
.pack .cart:hover, .pack .cart:focus-visible { transform: translateY(-4px); }
.pack .cart { transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
.pack .cart-by, .pack .cart-tags { display: none; }
/* One screen: on wide screens the front page is the header, the cabinet and a one-line footer. */
@media (min-width: 961px) {
  :root[data-route="home"] body { min-height: 100dvh; margin: 0; display: flex; flex-direction: column; }
  :root[data-route="home"] .wrap { flex: 1; width: 100%; display: flex; flex-direction: column; padding-block: 14px 10px; }
  :root[data-route="home"] .pack { display: grid; flex: 1; }
  :root[data-route="home"] .pack { min-height: 560px; }
  :root[data-route="home"] .wrap { max-width: 1480px; }
}
@media (min-width: 961px) and (max-height: 840px) {
  .pack { row-gap: 10px; }
  .pack .hero-copy { padding: 20px 22px 14px; gap: 10px; }
  .pack .hero-title { font-size: clamp(2.5rem, min(4.6vw, 7.2vh), 4.5rem); }
  .pack .lede { font-size: 1rem; }
  .maker-box textarea { padding-block: 8px 2px; }
  .maker-box textarea[rows] { height: 3.5em; }
  .maker-bar .btn { min-height: 40px; }
  .pack .cart .sticker img { height: clamp(56px, 9vh, 90px); }
  .mascot { translate: calc(var(--px) * 40px) calc(-42% + var(--py) * 30px); }
}
.foot-mini { margin-top: 10px; padding: 6px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--sheet); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; font-size: .75rem; }
.foot-mini .foot-links { margin-left: auto; gap: 4px 14px; }
@media (max-width: 960px) {
  .pack { grid-template-columns: 1fr; padding: 4px 0 18px; }
  .pack .hero-copy, .pack .stage3d { grid-column: auto; }
  .stage3d { margin: 56px 0 6px; width: 100%; }
  .mascot { width: 92px; right: 12px; translate: 0 -72%; }
  .pack .console { transform: none; }
}
@media (max-width: 560px) {
  .pack .hero-copy { margin-inline: -6px; padding: 22px 16px 16px; }
  .maker-ideas { margin-inline: -16px; padding-inline: 16px; mask-image: none; }
  .pack .shelf { grid-auto-columns: 132px; margin-inline: -16px; padding-inline: 16px; }
}

.console { position: relative; margin: 0; background: var(--die); color: var(--die-ink); border: 1px solid var(--line); border-radius: var(--r-l); padding: 10px 10px 12px; display: grid; gap: 8px; box-shadow: 0 18px 34px -20px var(--shadow); min-width: 0; }
.console .screen { border: 0; border-radius: var(--r-m); box-shadow: none; }
.console-cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; padding: 0 6px; font-size: .875rem; color: var(--die-ink-2); }
.console-cap b, .console-cap a { color: var(--die-ink); }
.console-cap a { font-weight: 500; text-decoration-color: var(--accent); }

/* ---------- business page ---------- */
.ways { display: grid; gap: 0; border-top: 1px solid var(--line); }
.way { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); grid-template-rows: auto 1fr; gap: 6px 48px; padding: 26px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.way > * { grid-column: 1; }
.way > ul, .way > .btn { grid-column: 2; grid-row: 1 / span 2; align-self: start; }
.way h3 { font: 600 clamp(1.375rem, 2.2vw, 1.875rem)/1.1 var(--display); letter-spacing: -.025em; }
.way p { color: var(--ink-2); }
.way .btn { justify-self: start; }
@media (max-width: 760px) { .way { grid-template-columns: 1fr; } .way > ul, .way > .btn { grid-column: 1; grid-row: auto; margin-top: 8px; } }

.steps { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.steps li { display: grid; gap: 6px; align-content: start; min-width: 0; }
.steps b { font: 600 1.1875rem/1.2 var(--display); letter-spacing: -.015em; }
.steps p { color: var(--ink-2); font-size: .9375rem; }
@media (max-width: 960px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }


.feature-grid { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; }
.feature-grid li { display: grid; gap: 4px; padding: 16px 0; border-top: 1px solid var(--line); align-content: start; }
.feature-grid b { font-weight: 600; font-size: 1.0625rem; }
.feature-grid span { color: var(--ink-2); font-size: .9375rem; }
@media (max-width: 640px) { .feature-grid { grid-template-columns: 1fr; } }


.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 18px 40px; }
.page-head h1 { font: 600 clamp(2.125rem, 4.2vw, 3.25rem)/1.05 var(--display); letter-spacing: -.035em; }
.page-head .lede { max-width: 40em; }
.contact { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 700; }
.contact b { font-size: .875rem; user-select: all; }
.closing .panel { padding: 28px; border-radius: var(--r-l); }
.closing h2 { font: 600 1.625rem/1.1 var(--display); letter-spacing: -.025em; }

/* ---------- game tiles ---------- */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px 20px; }
.cart { display: grid; gap: 10px; align-content: start; color: var(--ink); text-decoration: none; cursor: pointer; border-radius: var(--r-m); }
.cart.in .sticker { animation: pop .6s cubic-bezier(.16, 1, .3, 1) calc(var(--i, 0) * 60ms) backwards; }
.cart:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.cart:hover .sticker, .cart:focus-visible .sticker { transform: translateY(-3px); border-color: var(--shell-dark); box-shadow: 0 2px 4px var(--shadow), 0 22px 34px -20px var(--shadow); }
.cart:hover .sticker::after, .cart:focus-visible .sticker::after { translate: 120% 0; }
.cart:active .sticker { transform: translateY(-1px); transition-duration: .1s; }
.cart-body { display: contents; }
.cart-label { display: contents; }
.cart-title { font: 600 1.0625rem/1.2 var(--display); letter-spacing: -.01em; overflow-wrap: anywhere; padding: 2px 2px 0; }
.cart:hover .cart-title { color: var(--accent); }
.cart-by { padding: 0 2px; font-size: .875rem; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; margin-top: -6px; }
.cart-by b { font-weight: 600; color: var(--ink); }
.cart-tags { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 2px; }
.cart-tags:empty { display: none; }
.cart-serial, .cart-grip { display: none; }
@media (max-width: 520px) {
  .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
  .cart-title { font-size: 1.0625rem; }
  .cart-by { font-size: .78125rem; flex-wrap: wrap; gap: 0 6px; }
}
.empty { border: 1px dashed color-mix(in srgb, var(--muted) 55%, transparent); border-radius: var(--r-m); padding: 28px; display: grid; gap: 10px; justify-items: start; color: var(--ink-2); }
.empty h1, .empty h2, .empty h3 { font: 600 1.25rem/1.2 var(--display); letter-spacing: -.02em; color: var(--ink); }

/* ---------- screen ---------- */
.screen { position: relative; background: #05070a; border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 2px 2px rgba(0, 0, 0, .08), 0 16px 30px -20px var(--shadow); max-width: 100%; }
.screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #05070a; }
.rate { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.star { background: transparent; border: 1px solid transparent; border-radius: var(--r-s); min-width: 40px; min-height: 40px; font-size: 1.375rem; line-height: 1; color: var(--ink); cursor: pointer; padding: 0 4px; }
.star:hover, .star[aria-pressed="true"] { border-color: var(--line); }
.mp-split { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--line); }
.mp-split > div { position: relative; min-width: 0; }
.screen-cover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 7, 10, .5); border: 0; cursor: pointer; color: #fff; padding: 0; }
.screen-cover span { display: inline-flex; align-items: center; gap: 10px; background: var(--die); color: var(--die-ink); font: 500 1rem/1 var(--body); padding: 14px 24px; border-radius: 999px; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); }
.screen:fullscreen { border: 0; border-radius: 0; aspect-ratio: auto; }
@media (max-width: 640px) { .screen { aspect-ratio: 4 / 5; border-radius: var(--r-m); } .console .screen { aspect-ratio: 4 / 3; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- game page ---------- */
.gp-head { display: grid; gap: 10px; margin-bottom: 20px; justify-items: start; }
.gp-head h1 { font: 600 clamp(2rem, 4vw, 3rem)/1.05 var(--display); letter-spacing: -.035em; }
.gp-head > p.muted { max-width: 62ch; }
.gp-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 26px; align-items: start; }
.gp-main { display: grid; gap: 14px; min-width: 0; }
.gp-side { display: grid; gap: 14px; min-width: 0; }
@media (max-width: 960px) { .gp-grid { grid-template-columns: 1fr; } }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; overflow-x: auto; scrollbar-width: none; justify-self: start; max-width: 100%; }
.tabs button { border: 0; background: transparent; padding: 8px 16px; font-weight: 500; font-size: .875rem; color: var(--ink-2); border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 2px 6px -2px var(--shadow); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 14px; font-size: .875rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.hash { font: 500 .75rem/1.5 var(--mono); overflow-wrap: anywhere; color: var(--ink-2); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 118px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: .84375rem; }
.bar i { display: block; height: 10px; background: var(--accent); border-radius: 999px; }
.bar i.p { background: var(--gold); }
.bar i.f { background: var(--muted); }
.bar em { font-style: normal; text-align: right; font: 500 .75rem var(--mono); }
.lineage { display: grid; gap: 6px; }
.lineage a { display: flex; gap: 8px; align-items: center; text-decoration: none; color: var(--ink); font-weight: 700; }
.lineage .pipe { width: 2px; height: 14px; background: var(--line); margin-left: 9px; }

/* ---------- tables ---------- */
.spec { border-radius: var(--r-l); background: var(--panel); overflow: hidden; border: 1px solid var(--line); }
.spec table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
.spec th, .spec td { padding: 14px 16px; text-align: left; vertical-align: top; }
.spec tbody tr + tr th, .spec tbody tr + tr td { border-top: 1px solid var(--line); }
.spec thead th { font: 700 .875rem var(--body); color: var(--ink-2); }
.spec thead th:last-child { font: 600 1rem var(--display); letter-spacing: -.01em; color: var(--pack-ink); background: var(--pack); }
.spec tbody th { font-weight: 700; width: 22%; }
.spec td.us { color: var(--ink); font-weight: 700; background: var(--accent-soft); }
.spec td.them { color: var(--ink-2); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-l); background: var(--panel); }
table.data { border-collapse: collapse; width: 100%; font-size: .875rem; }
table.data th { text-align: left; font: 700 .8125rem var(--body); color: var(--ink-2); padding: 11px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.r, table.data th.r { text-align: right; }
table.data td.n { font: 500 .78125rem var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover td { background: var(--panel-2); }
table.data tr.detail td { background: var(--panel-2); }
pre.code { margin: 0; font: 500 .75rem/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px; max-height: 340px; overflow: auto; }

/* ---------- studio ---------- */
.studio { display: grid; grid-template-columns: minmax(320px, .95fr) minmax(0, 1.25fr); gap: 26px; align-items: start; }
.studio > * { min-width: 0; }
@media (max-width: 960px) { .studio { grid-template-columns: 1fr; } .studio .st-right { order: -1; } }
.st-right { position: sticky; top: 76px; display: grid; gap: 12px; }
@media (max-width: 960px) { .st-right { position: static; } }
.chat { display: grid; gap: 10px; max-height: 340px; overflow: auto; padding-right: 4px; }
.msg { padding: 10px 14px; border-radius: var(--r-m); font-size: .90625rem; border: 1px solid var(--line); background: var(--bg); }
.msg.me { background: var(--accent-soft); border-color: transparent; justify-self: end; max-width: 92%; border-bottom-right-radius: 2px; }
.msg.note { color: var(--muted); font-size: .84375rem; background: transparent; border-style: dashed; }
.stream { font: 500 .6875rem/1.5 var(--mono); color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px; max-height: 150px; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
/* One-tap remix on game pages, and the phone QR code. */
.remix-box { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--panel); margin-top: 12px; }
.remix-box label { font-size: .875rem; line-height: 1.4; }
.remix-box .row { flex-wrap: nowrap; }
.remix-box input { flex: 1 1 auto; min-width: 0; }
.qr { width: min(260px, 70vw); margin: 4px auto; border-radius: var(--r-m); overflow: hidden; }
.qr svg { display: block; width: 100%; height: auto; }
.testing-veil { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 16px; text-align: center; background: var(--panel); color: var(--ink); }
.testing-veil small { color: var(--muted); font-size: .8125rem; max-width: 30ch; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.test-box { position: fixed; left: 0; top: 0; width: min(480px, 100vw); height: 300px; opacity: 0; pointer-events: none; z-index: -1; overflow: hidden; }
.test-box iframe { width: 100%; height: 100%; border: 0; display: block; }
.split-tag { position: absolute; z-index: 1; top: 8px; left: 8px; pointer-events: none; font: 600 .75rem/1 var(--body); padding: 5px 9px; border-radius: 999px; background: var(--die); color: var(--die-ink); }
.changes { display: grid; gap: 8px; max-height: 56vh; overflow: auto; }
pre.diff .del { color: var(--bad); }
pre.diff .add { color: var(--good); }
.checklist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.checklist li { display: grid; grid-template-columns: 1.1em 1fr; gap: 6px; align-items: start; }
.checklist li.done > span:first-child { color: var(--good); }
.checklist li.todo { color: var(--muted); }
.msg .checklist + .btn { margin-top: 8px; }
.room-board { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: .875rem; counter-reset: rank; }
.room-board li { display: grid; grid-template-columns: 1.6em 1fr auto; gap: 8px; align-items: baseline; counter-increment: rank; }
.room-board li::before { content: counter(rank) "."; color: var(--muted); font-variant-numeric: tabular-nums; }
.room-board li.me { font-weight: 600; }
.room-board b { font-variant-numeric: tabular-nums; }
.problems { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: .875rem; }
/* Drafts and visibility in the studio. */
.drafts { align-items: center; }
.drafts-list summary { cursor: pointer; color: var(--ink-2); font-size: .875rem; }
.drafts-list ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.drafts-list li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .875rem; }
fieldset.vis { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; min-width: 0; }
fieldset.vis legend { padding: 0; margin-bottom: 6px; }
fieldset.vis .seg { justify-self: start; }
/* Guided start in the studio: one question at a time, big pickable answers. */
.guide-q { font: 700 1.375rem/1.2 var(--display); letter-spacing: -.02em; margin: 0; }
.guide-q:focus { outline: none; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.steps li { font-size: .75rem; color: var(--muted); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.steps li.done { color: var(--ink-2); background: var(--panel-2); }
.steps li[aria-current="step"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pick { text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r-m); padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; color: var(--ink); font: inherit; min-height: 64px; }
.pick b { font: 600 1rem/1.2 var(--display); }
.pick small { color: var(--muted); font-size: .78125rem; line-height: 1.35; }
.pick:hover { border-color: var(--ink-2); }
.pick[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.pick:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.kitpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.kitpick button { text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r-s); padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.kitpick button b { font: 600 1rem/1.2 var(--display); letter-spacing: -.01em; }
.kitpick button small { color: var(--muted); font-size: .78125rem; line-height: 1.35; }
.kitpick button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--panel); }
.knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 18px; }
.banner { border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 16px; background: var(--panel); display: grid; gap: 8px; font-size: .90625rem; }
.banner.bad { border-color: var(--bad); }
.banner.warn { border-color: var(--warn); }
.banner.info { border-color: var(--accent); }
.versions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- wallet / economy ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.balance { display: grid; gap: 6px; }
.balance .amt { font: 600 2.25rem/1.05 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.balance .unit { font: 700 .8125rem var(--body); color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.fact { display: grid; gap: 0; }
.fact b { font: 600 1.375rem/1.2 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.fact span { font-size: .8125rem; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.emission-chart-wrap { min-width: 0; max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }
.emission-chart-wrap .chart { min-width: 600px; }
.diagram-wrap { overflow-x: auto; }
.diagram-wrap svg { min-width: 640px; width: 100%; height: auto; display: block; }

/* ---------- overlays ---------- */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(520px, calc(100% - 32px)); pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: var(--r-m); padding: 12px 16px; font-size: .90625rem; box-shadow: 0 10px 28px var(--shadow); display: flex; gap: 12px; align-items: center; justify-content: space-between; animation: pop .4s cubic-bezier(.16, 1, .3, 1) backwards; }
.toast.bad { background: var(--bad); color: #fff; }
.toast .mono { opacity: .8; }
.modal-back { position: fixed; inset: 0; z-index: 50; background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-l); width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 26px; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .45); display: grid; gap: 14px; }
.modal h2 { font: 600 1.5rem/1.15 var(--display); letter-spacing: -.025em; }
fieldset.prefs { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 12px 0 0; display: grid; gap: 8px; min-width: 0; }
fieldset.prefs legend { padding: 0; font-weight: 700; float: left; width: 100%; margin-bottom: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; clear: both; }
label.opt { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--sheet); cursor: pointer; font-size: .9375rem; }
label.opt:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
label.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { font-size: .84375rem; color: var(--muted); }

/* ---------- one screen ---------- */
/* data-fit (the default Page layout): the window never scrolls. app.js groups the page's blocks into panes that fit,
   hides the others (.off) and adds a pager; a block taller than the window (.tall) keeps its own scroll box. */
:root[data-fit] { height: 100%; overflow: hidden; }
:root[data-fit] body { height: 100%; margin: 0; overflow: hidden; display: flex; flex-direction: column; }
:root[data-fit] .top { flex: none; }
:root[data-fit] .wrap { flex: 1; min-height: 0; width: 100%; overflow: hidden; display: flex; flex-direction: column; padding-block: 20px 12px; }
:root[data-fit] #view > .section, :root[data-fit] #view > section + section { margin-top: 32px; }
:root[data-fit] #view > .foot { margin-top: 32px; }
:root[data-fit] #view .fit-lead { margin-top: 0; }
/* A pane with room to spare sits in the middle of the window. */
:root[data-fit] #view:has(> .pager) > .fit-lead { margin-top: auto; }
:root[data-fit] #view .fit-off { display: none !important; }
:root[data-fit] #view .fit-tall { max-height: var(--fit-h); overflow: auto; overscroll-behavior: contain; grid-auto-rows: max-content; }
/* Phones: game shelves become a sideways row you swipe, and game screens get shorter. */
@media (max-width: 560px) {
  :root[data-fit] #view .shelf { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 62%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding: 4px 16px 8px; }
  :root[data-fit] #view .shelf::-webkit-scrollbar { display: none; }
  :root[data-fit] #view .shelf > * { scroll-snap-align: start; }
  :root[data-fit] .gp-main .screen, :root[data-fit] .st-right .screen { aspect-ratio: 4 / 3; }
}
/* The game page and the studio keep their columns side by side and let each column hold its own overflow. */
:root[data-fit] #view .gp-grid.fit-tall, :root[data-fit] #view .studio.fit-tall { height: var(--fit-h); overflow: hidden; align-items: stretch; }
:root[data-fit] .gp-grid.fit-tall > *, :root[data-fit] .studio.fit-tall > * { min-height: 0; max-height: 100%; overflow: auto; overscroll-behavior: contain; align-content: start; }
:root[data-fit] .studio.fit-tall .st-right { position: static; }
:root[data-fit] .gp-grid.fit-tall > *, :root[data-fit] .studio.fit-tall > * { grid-auto-rows: max-content; }
/* The game screen shrinks to leave room for its controls, so the play column never needs its scroll box. */
:root[data-fit] .gp-grid.fit-tall .gp-main .screen, :root[data-fit] .studio.fit-tall .st-right .screen { width: min(100%, calc((var(--fit-h) - 120px) * 1.6)); }
.enter-up { animation: pane-up .5s cubic-bezier(.32, .72, 0, 1) backwards; }
.enter-down { animation: pane-down .5s cubic-bezier(.32, .72, 0, 1) backwards; }
@keyframes pane-up { from { opacity: 0; transform: translateY(28px); } }
@keyframes pane-down { from { opacity: 0; transform: translateY(-28px); } }
.pager { margin-top: auto; padding-top: 12px; align-self: center; display: flex; align-items: center; gap: 6px; max-width: 100%; position: relative; z-index: 1; }
.pager { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: 0 1px 2px var(--shadow), 0 10px 24px -14px var(--shadow); }
.pg-step { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--panel-2); color: var(--ink); cursor: pointer; flex: none; transition: background-color .2s, transform .3s cubic-bezier(.32, .72, 0, 1); }
.pg-step:hover:not(:disabled) { background: var(--shell); }
.pg-step:active:not(:disabled) { transform: scale(.94); }
.pg-step.next .ico { rotate: 180deg; }
.pg-step:disabled { opacity: .35; cursor: default; }
.pg-dots { display: flex; }
.pg-dot { display: grid; place-items: center; width: 24px; height: 28px; border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: 999px; }
.pg-dot i { width: 7px; height: 7px; border-radius: 999px; background: var(--shell-dark); transition: width .4s cubic-bezier(.32, .72, 0, 1), background-color .2s; }
.pg-dot:hover i { background: var(--ink-2); }
.pg-dot[aria-current] { width: 34px; }
.pg-dot[aria-current] i { width: 22px; background: var(--ink); }
.pg-name { font-size: .875rem; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding-inline: 6px 4px; }
.pg-count { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
@media (max-width: 560px) { .pg-dots { display: none; } .pager { align-self: stretch; justify-content: space-between; } }
/* The front page on phones: the copy card, the console and the rail become panes. */
@media (max-width: 960px) {
  :root[data-fit][data-route="home"] .pack { padding: 0; }
  :root[data-fit][data-route="home"] .stage3d { margin-top: 44px; }
  :root[data-fit][data-route="home"] .stage3d.fit-lead { margin-top: 44px; }
}

/* ---------- playful pixel-world portal ---------- */
body { line-height: 1.5; }
.wrap, .top-in { max-width: 1440px; }
.wrap { padding: 28px 28px 64px; }
.top { background: var(--panel); border-bottom: 1px solid var(--line); backdrop-filter: none; -webkit-backdrop-filter: none; }
.top-in { min-height: 72px; gap: 18px; padding: 12px 28px; }
.mark b { font: 700 1.3rem/1.15 var(--display); letter-spacing: -.055em; }
.mark b::before { width: 22px; height: 22px; border-radius: 0; background: var(--accent); box-shadow: 7px -7px 0 -3px var(--cool), -5px 5px 0 -2px var(--hot); transform: none; }
.mark span { font: 500 .65rem/1.3 var(--mono); padding: 5px 7px; border: 1px solid var(--line); border-radius: 8px; max-width: 5.2rem; }
.nav { gap: 3px; }
.nav a { border-radius: 10px; padding: 10px 12px; font-size: .85rem; font-weight: 600; }
.nav a:hover, .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.hbtn, .wchip { border-radius: 10px; min-height: 39px; padding-inline: 10px; background: var(--sheet); box-shadow: none; }
.hbtn { font-size: .75rem; }
.wchip { max-width: 100%; }
.wchip .bal { gap: 7px; }
.section { margin-top: 52px; gap: 22px; }
.section-head { padding-top: 12px; }
.section-head h2, .h2 { font: 700 clamp(1.35rem, 2vw, 2rem)/1.3 var(--display); letter-spacing: -.05em; }
.page-head, .gp-head { padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.page-head h1, .gp-head h1, .page-title { font: 700 clamp(1.8rem, 3.5vw, 3.1rem)/1.2 var(--display); letter-spacing: -.06em; max-width: 25ch; overflow-wrap: anywhere; }
.gp-head { gap: 12px; margin-bottom: 24px; }
.page-head .lede { max-width: 55ch; font-size: 1rem; }
.page-kicker { font: 500 .75rem/1.4 var(--mono); color: var(--accent); letter-spacing: .035em; }
.eyebrow { font: 600 .8rem/1.4 var(--body); }
.display { font-weight: 700; }
.panel { background: var(--panel); border-radius: var(--r-m); padding: 24px; box-shadow: none; }
.btn { border-radius: 10px; border-color: var(--line); min-height: 44px; padding: 11px 18px; font-weight: 600; box-shadow: 0 3px 0 var(--line); transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--line); border-color: var(--accent); }
.btn:active, .btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 0 var(--ink-2); }
.btn.primary:hover { background: var(--accent); transform: translateY(-2px); }
.btn.ghost { box-shadow: none; }
.btn.small { min-height: 36px; padding: 8px 11px; }
.btn:disabled, .btn.primary:disabled { transform: none; box-shadow: none; }
.chip { border-radius: 8px; padding: 6px 9px; font-size: .75rem; background: var(--sheet); }
.seg, .tabs { border-radius: 12px; padding: 4px; gap: 4px; background: var(--sheet); }
.seg button, .tabs button { border-radius: 8px; font-size: .85rem; padding: 9px 12px; font-weight: 600; }
.seg button[aria-pressed="true"], .tabs button[aria-selected="true"] { background: var(--panel); box-shadow: 0 2px 0 var(--line); }
input[type="text"], input[type="number"], textarea, select { background: var(--panel); border-radius: 9px; border-color: var(--line); box-shadow: none; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline-offset: 3px; }
.banner { border-radius: 12px; border-left-width: 4px; background: var(--panel); }
.empty { border-style: solid; border-radius: 16px; background: var(--sheet); padding: 28px; }
.empty h1, .empty h2, .empty h3 { font: 700 1.4rem/1.3 var(--display); }
.foot { margin-top: 52px; padding-top: 20px; font-size: .8rem; }
.foot-mark { font: 700 1.3rem/1.3 var(--display); }
.foot-mini { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 12px 0 0; font-size: .7rem; gap: 6px 20px; margin-top: 16px; }
.foot-mini > p:first-child { max-width: 45rem; }
.foot-mini .foot-links { font-size: .75rem; }

/* One world to create in, one real game to play, then a shelf to explore. Each can be a fitted pane. */
.pack { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; gap: 28px; padding: 0; align-items: start; }
.pack .hero-copy { grid-column: 1; position: relative; isolation: isolate; min-height: 530px; overflow: hidden; padding: 48px; gap: 20px; border: 1px solid #6fa4c7; border-radius: 24px; background: #a4daf4; color: #14334b; box-shadow: none; translate: none; animation: none; align-content: center; }
.play-world-art { position: absolute; inset: 0; z-index: -2; background: #a4daf4 url('PLAY_WORLD_STILL') center/cover no-repeat; image-rendering: pixelated; }
.pack .hero-copy::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(234,249,255,.95), rgba(234,249,255,.84) 32%, rgba(234,249,255,0) 64%); pointer-events: none; }
.pack .hero-copy > :not(.play-world-art):not(.workshop-scene) { position: relative; width: min(520px, 100%); z-index: 2; }
.pack .hero-title { font: 700 clamp(2.25rem, 3.7vw, 3.6rem)/1.12 var(--display); letter-spacing: -.065em; color: #14334b; text-wrap: balance; text-shadow: 3px 3px 0 #fffdf0; }
.pack .hero-title .hl { color: #14334b; }
.pack .hero-title span { animation: pixel-enter .4s steps(4, end) backwards; }
.pack .hero-title span:nth-child(2) { animation-delay: .1s; }
.pack .lede { color: #14334b; font-size: 1rem; max-width: 41ch; }
.pack .page-kicker { color: #14334b; }
.workshop-scene { position: absolute; inset: 18px 0 auto auto; width: 57%; height: 360px; pointer-events: none; }
/* This illustrated hero already supplies the detailed static world; retain the standalone scene fallback elsewhere. */
.pack .hero-copy > .play-world-art + .workshop-scene[data-workshop-mode="static"] > .ws-still { display: none; }
.pack .hero-copy > .play-world-art + .workshop-scene > .ws-canvas { opacity: .26; }
.maker { gap: 12px; }
.maker-box { border: 2px solid #14334b; border-radius: 14px; background: #fffdf0; padding: 10px; box-shadow: 0 6px 0 rgba(20,51,75,.2); }
.maker-box textarea { font-size: 1rem; padding: 10px 8px 14px; background: #fffdf0; color: #14334b; box-shadow: none; }
.maker-box textarea::placeholder { color: #476375; }
.maker-bar { padding: 0; gap: 9px; }
.maker-bar .btn { min-height: 44px; padding-inline: 16px; font-size: .9rem; background: #c6ed61; color: #14334b; border-color: #6d9430; box-shadow: 0 3px 0 #6d9430; }
.maker-bar .seg { border: 0; padding: 0; background: #e4f0f8; }
.maker-bar .seg button { font-size: .8rem; padding: 9px 12px; color: #14334b; }
.maker-bar .seg button[aria-pressed="true"] { background: #14334b; color: #fffdf0; }
.maker-ideas { gap: 8px; mask-image: none; padding: 4px 0; flex-wrap: wrap; overflow: visible; }
.pack .maker-ideas .fine { color: #14334b; }
.pack .maker-ideas .chip { background: #fffdf0; color: #14334b; border-color: #6fa4c7; font-size: .75rem; padding: 8px 10px; text-decoration: none; }
.pack .stage3d { grid-column: 1; width: 100%; min-height: 0; height: auto; justify-self: stretch; margin: 0; padding: 24px; background: var(--sheet); border: 1px solid var(--line); border-radius: 24px; display: grid; justify-items: center; gap: 16px; }
.stage-note { color: var(--ink-2); font: 600 .85rem/1.4 var(--body); text-align: center; }
.pack .console { width: min(760px, 100%); margin: 0; padding: 12px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 5px 0 var(--line); transform: none; animation: none; }
.console .screen { border-radius: 9px; outline: none; }
.console-cap { margin-top: 5px; font-size: .8125rem; gap: 8px; line-height: 1.5; }
.console-cap b { font-size: inherit; }
.pack .mascot { top: auto; right: 5%; left: auto; bottom: 36px; width: 100px; translate: none; filter: drop-shadow(0 4px 1px var(--shadow)); }
.pack-shelf { grid-column: 1; gap: 16px; padding: 12px 0 0; }
.pack-shelf-head { width: 100%; justify-content: space-between; border: 0; background: transparent; padding: 0; box-shadow: none; }
.pack-shelf-head h2 { font: 700 1.35rem/1.3 var(--display); }
.pack-shelf-head a { font-size: .85rem; }
.pack .shelf { gap: 20px; padding: 6px 4px 12px; margin: -6px -4px -12px; grid-auto-columns: minmax(210px, 1fr); }
.pack .cart .sticker img { height: 140px; }
.pack .cart-title { border: 0; padding: 0; color: var(--ink); background: transparent; font-size: .9rem; }
.pack .cart-by, .pack .cart-tags { display: none; }

/* Games lead with real art; titles and provenance stay readable without hover. */
.shelf { grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 24px; }
.cart { position: relative; padding: 0; border: 1px solid var(--line); border-radius: 18px; gap: 0; overflow: hidden; background: var(--panel); box-shadow: 0 4px 0 var(--line); transition: transform .2s ease, box-shadow .2s ease; }
.cart:hover, .cart:focus-visible { transform: translateY(-4px); box-shadow: 0 8px 0 var(--line); }
.cart .sticker { border: 0; border-radius: 0; box-shadow: none; transform: none; }
.cart .sticker img { width: 100%; aspect-ratio: 16/10; object-fit: cover; height: auto; }
.cart:hover .sticker, .cart:focus-visible .sticker { transform: none; box-shadow: none; }
.cart-body { display: grid; gap: 12px; padding: 17px; }
.cart-label { display: grid; gap: 9px; }
.cart-title { font: 700 1rem/1.35 var(--display); letter-spacing: -.05em; padding: 0; }
.cart-by { padding: 0; margin: 0; font-size: .8rem; line-height: 1.45; }
