<style>
/* The look: a sticker pack. The page is the liner sheet, games are die-cut stickers with white borders,
   and the front page opens on a chartreuse header card with a hang tab. Font sizes are in rem so the
   reader's browser setting and the in-page text size both scale the type. */
:root {
  --bg: #e9edf1;
  --sheet: #f6f8fa;
  --panel: #ffffff;
  --panel-2: #f1f4f7;
  --shell: #dde3e9;
  --shell-dark: #c3ccd6;
  --ink: #14181e;
  --ink-2: #3b434e;
  --muted: #56606c;
  --line: #cfd6de;
  --accent: #356c06;
  --accent-ink: #ffffff;
  --accent-soft: #e2f4b0;
  --pack: #c6ef3a;
  --pack-ink: #141a0c;
  --pack-ink-2: #34401c;
  --die: #ffffff;
  --die-ink: #14181e;
  --gold: #8a6300;
  --good: #16764a;
  --warn: #9c5a00;
  --bad: #bf3329;
  --seg-3: #0f7a6f;
  --led: #356c06;
  --shadow: rgba(20, 24, 30, .2);
  --scrim: rgba(10, 12, 16, .55);
  --display: "Dela Gothic One", "Arial Black", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-s: 10px;
  --r-m: 16px;
  --r-l: 26px;
  font-size: 100%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --sheet: #1b1f25; --panel: #1f242b; --panel-2: #272d35; --shell: #2b3139; --shell-dark: #1a1e24;
    --ink: #eef1f4; --ink-2: #bcc4ce; --muted: #929ca9; --line: #353d47;
    --accent: #c6ef3a; --accent-ink: #141a0c; --accent-soft: #2c3611;
    --pack: #c6ef3a; --pack-ink: #141a0c; --pack-ink-2: #34401c; --die: #eef1f3; --die-ink: #14181e;
    --gold: #f1c04d; --good: #4cc681; --warn: #f2a63c; --bad: #ff6e64; --seg-3: #4fd1c0; --led: #c6ef3a;
    --shadow: rgba(0, 0, 0, .55); --scrim: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --sheet: #1b1f25; --panel: #1f242b; --panel-2: #272d35; --shell: #2b3139; --shell-dark: #1a1e24;
  --ink: #eef1f4; --ink-2: #bcc4ce; --muted: #929ca9; --line: #353d47;
  --accent: #c6ef3a; --accent-ink: #141a0c; --accent-soft: #2c3611;
  --pack: #c6ef3a; --pack-ink: #141a0c; --pack-ink-2: #34401c; --die: #eef1f3; --die-ink: #14181e;
  --gold: #f1c04d; --good: #4cc681; --warn: #f2a63c; --bad: #ff6e64; --seg-3: #4fd1c0; --led: #c6ef3a;
  --shadow: rgba(0, 0, 0, .55); --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}
/* In-page choices from Accessibility settings win over the device and the viewer theme. */
:root[data-gp-theme="light"] {
  --bg: #e9edf1; --sheet: #f6f8fa; --panel: #ffffff; --panel-2: #f1f4f7; --shell: #dde3e9; --shell-dark: #c3ccd6;
  --ink: #14181e; --ink-2: #3b434e; --muted: #56606c; --line: #cfd6de;
  --accent: #356c06; --accent-ink: #ffffff; --accent-soft: #e2f4b0;
  --pack: #c6ef3a; --pack-ink: #141a0c; --pack-ink-2: #34401c; --die: #ffffff; --die-ink: #14181e;
  --gold: #8a6300; --good: #16764a; --warn: #9c5a00; --bad: #bf3329; --seg-3: #0f7a6f; --led: #356c06;
  --shadow: rgba(20, 24, 30, .2); --scrim: rgba(10, 12, 16, .55);
  color-scheme: light;
}
:root[data-gp-theme="dark"] {
  --bg: #14171c; --sheet: #1b1f25; --panel: #1f242b; --panel-2: #272d35; --shell: #2b3139; --shell-dark: #1a1e24;
  --ink: #eef1f4; --ink-2: #bcc4ce; --muted: #929ca9; --line: #353d47;
  --accent: #c6ef3a; --accent-ink: #141a0c; --accent-soft: #2c3611;
  --pack: #c6ef3a; --pack-ink: #141a0c; --pack-ink-2: #34401c; --die: #eef1f3; --die-ink: #14181e;
  --gold: #f1c04d; --good: #4cc681; --warn: #f2a63c; --bad: #ff6e64; --seg-3: #4fd1c0; --led: #c6ef3a;
  --shadow: rgba(0, 0, 0, .55); --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}
:root[data-gp-theme="contrast"] {
  --bg: #000000; --sheet: #000000; --panel: #000000; --panel-2: #141414; --shell: #2e2e2e; --shell-dark: #000000;
  --ink: #ffffff; --ink-2: #ffffff; --muted: #e8e8e8; --line: #ffffff;
  --accent: #ffd60a; --accent-ink: #000000; --accent-soft: #3a3000;
  --pack: #ffd60a; --pack-ink: #000000; --pack-ink-2: #000000; --die: #ffffff; --die-ink: #000000;
  --gold: #ffd60a; --good: #7dff9a; --warn: #ffb340; --bad: #ff8a80; --seg-3: #7df9ff; --led: #ffd60a;
  --shadow: rgba(0, 0, 0, 0); --scrim: rgba(0, 0, 0, .85);
  color-scheme: dark;
}
:root[data-gp-text="lg"] { font-size: 112.5%; }
:root[data-gp-text="xl"] { font-size: 125%; }
@media (prefers-contrast: more) {
  :root:not([data-gp-theme]) { --muted: var(--ink-2); --line: var(--ink-2); }
}

* { box-sizing: border-box; }
html { scrollbar-color: var(--shell-dark) var(--bg); }
::selection { background: var(--pack); color: var(--pack-ink); }
input, textarea { caret-color: var(--accent); }
body { background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: .14em; text-underline-offset: .2em; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
.mono { font-family: var(--mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: .875rem; }
.eyebrow { font: 700 .875rem/1.3 var(--body); color: var(--ink-2); }
.display { font-family: var(--display); font-weight: 400; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.linkish { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: .14em; text-underline-offset: .2em; cursor: pointer; font: inherit; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r-s); font-weight: 700; text-decoration: none; }
.skip:focus { top: calc(10px + env(safe-area-inset-top, 0px)); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.mark b { font: 400 1.0625rem/1 var(--display); background: var(--pack); color: var(--pack-ink); padding: 8px 12px 7px; border-radius: 999px; box-shadow: 0 0 0 3px var(--die), 0 3px 8px -2px var(--shadow); rotate: -2deg; }
.mark span { font: 700 .75rem/1 var(--body); color: var(--muted); }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 3px; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 8px 13px; font-weight: 700; color: var(--ink-2); text-decoration: none; border-radius: 999px; white-space: nowrap; }
.nav a:hover { color: var(--ink); background: var(--panel); }
.nav a[aria-current="page"] { color: var(--die-ink); background: var(--die); box-shadow: 0 2px 6px -2px var(--shadow); }
.hbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; min-height: 38px; background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: 700 .8125rem var(--body); color: var(--ink); }
.hbtn:hover { background: var(--panel); }
.hbtn.on { border-color: var(--accent); color: var(--accent); }
.hbtn svg { width: 18px; height: 18px; flex: none; }
.wchip { display: flex; align-items: center; gap: 10px; min-height: 38px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 10px 6px 12px; cursor: pointer; font: 700 .8125rem var(--body); color: var(--ink); }
.wchip .addr { font: 500 .75rem var(--mono); }
.wchip .bal { display: flex; gap: 10px; font: 500 .75rem var(--mono); color: var(--ink-2); }
.wchip .bal span { display: inline-flex; align-items: center; gap: 4px; }
.ico { width: 14px; height: 14px; flex: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.dot.off { background: var(--muted); }
@media (max-width: 900px) {
  .top-in { gap: 8px 10px; padding-block: 10px 4px; }
  .hbtn { order: 2; }
  .wchip { order: 2; }
  .nav { order: 3; width: 100%; margin-inline: -6px; }
  .wchip .bal span:nth-child(3) { display: none; }
}
@media (max-width: 520px) {
  .top-in { padding-inline: 16px; gap: 8px; }
  .mark b { font-size: .9375rem; padding: 7px 10px 6px; }
  .hbtn { margin-left: auto; padding: 6px 9px; }
  .wchip { padding-inline: 9px; }
  .mark span { display: none; }
  .hbtn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wchip .bal span:nth-child(2) { display: none; }
}

/* ---------- page frame ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 72px; }
.wrap:focus { outline: none; }
@media (max-width: 560px) { .wrap { padding-inline: 16px; padding-block: 16px 64px; } }
.section { display: grid; gap: 18px; margin-top: 88px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.section-head h2, .h2 { font: 400 clamp(1.5rem, 2.6vw, 2.125rem)/1.08 var(--display); letter-spacing: -.005em; }
.section-head a { font-weight: 700; }
.section-head p { flex-basis: 100%; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 20px; min-width: 0; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.split { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.lede { font-size: 1.125rem; max-width: 36em; color: var(--ink-2); }

/* ---------- footer ---------- */
.foot { margin-top: 96px; padding: 26px 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px 40px; color: var(--muted); font-size: .875rem; }
.foot-main { display: grid; gap: 8px; max-width: 46em; justify-items: start; }
.foot-mark { font: 400 .9375rem/1 var(--display); color: var(--ink); }
.foot-links { display: flex; flex-wrap: wrap; gap: 8px 18px; align-content: start; justify-content: flex-end; }
.foot-links a, .foot-links .linkish { font-weight: 700; color: var(--ink); }
.foot-status { grid-column: 1 / -1; font-size: .8125rem; }
@media (max-width: 760px) { .foot { grid-template-columns: 1fr; } .foot-links { justify-content: flex-start; } }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font: 700 .9375rem/1.1 var(--body); cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), background-color .15s; }
.btn:hover { background: var(--panel-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--pack); border-color: var(--pack); color: var(--pack-ink); box-shadow: 0 0 0 2px var(--die), 0 4px 10px -4px var(--shadow); }
.btn.primary:hover { background: var(--pack); transform: translateY(-1px); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 34px; padding: 7px 12px; font-size: .8125rem; }
.btn.big { min-height: 52px; padding: 14px 22px; font-size: 1.0625rem; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 .78125rem/1 var(--body); padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 999px; color: var(--ink-2); background: var(--panel); white-space: nowrap; }
.pics { display: grid; gap: 8px; }
.pic { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--panel); }
.pic img { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; }
.pic input { min-width: 0; font-family: var(--mono); }
.chip.ok { color: var(--good); border-color: currentColor; }
.chip.bad { color: var(--bad); border-color: currentColor; }
.chip.gold { color: var(--gold); border-color: currentColor; }
.chip.accent { color: var(--accent); border-color: currentColor; }
button.chip { cursor: pointer; min-height: 32px; }
button.chip:hover { border-color: var(--ink-2); color: var(--ink); }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--panel); }
.stack > .seg { justify-self: start; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
label.field { display: grid; gap: 6px; font-weight: 700; font-size: .875rem; }
label.field small { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="number"], textarea, select { width: 100%; font: 400 .9375rem/1.4 var(--body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; }
textarea { resize: vertical; min-height: 92px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 18px; height: 18px; }
.knob { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: .875rem; }
.knob input { grid-column: 1 / -1; }
.knob output { font: 500 .75rem var(--mono); color: var(--muted); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 40px; height: 30px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; padding: 0; position: relative; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }
.swatch.custom .plus { position: absolute; right: 2px; bottom: 0; font: 800 .875rem/1 var(--body); color: #fff; text-shadow: 0 1px 2px #000; }
.brand-fields { display: flex; flex-wrap: wrap; gap: 10px 16px; }
label.color { display: inline-flex; align-items: center; gap: 8px; font-size: .875rem; font-weight: 700; }
label.color input { width: 44px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }

/* ---------- stickers: the shared material ---------- */
/* A die-cut sticker: art inside a thick white border, set a few degrees off straight (--r). */
.sticker { position: relative; display: block; background: var(--die); padding: 7px; border-radius: 20px; rotate: var(--r, 0deg);
  box-shadow: 0 1px 1px rgba(0, 0, 0, .08), 0 8px 18px -10px var(--shadow); transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), rotate .45s cubic-bezier(.34, 1.56, .64, 1), box-shadow .3s; }
.sticker img { display: block; width: 100%; height: auto; border-radius: 14px; }
/* The corner peel: the flap shows the sticker's back, the triangle under it shows the sheet. */
.sticker::after { content: ""; position: absolute; right: 0; bottom: 0; width: 0; height: 0; border-bottom-right-radius: 20px;
  background: linear-gradient(135deg, var(--shell) 0 48%, rgba(0, 0, 0, .14) 50%, var(--behind, var(--bg)) 52%); box-shadow: -3px -3px 6px -3px var(--shadow);
  transition: width .35s cubic-bezier(.34, 1.56, .64, 1), height .35s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes slap { 0% { opacity: 0; transform: scale(1.22) translateY(-14px); } 55% { opacity: 1; transform: scale(.96); } 100% { transform: none; } }

/* ---------- the pack: front page header card ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 40px; align-items: center; padding-top: 8px; }
.hero-copy { display: grid; gap: 18px; min-width: 0; justify-items: start; }
.hero-title { font: 400 clamp(2.5rem, 5.4vw, 4.5rem)/1.02 var(--display); letter-spacing: -.01em; }
.hero-title span { display: block; }
.page-title { font: 400 clamp(2rem, 4.2vw, 3.25rem)/1.05 var(--display); }
.hero .cta { margin-top: 2px; }
.ticks { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 18px; font-weight: 700; font-size: .9375rem; }
.ticks li { display: inline-flex; align-items: center; gap: 8px; }
.ticks li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pack); box-shadow: 0 0 0 2px var(--ink); flex: none; }
.ticks.small { display: grid; gap: 8px; font-weight: 400; font-size: .9375rem; }
.ticks.small li { align-items: baseline; }
@media (max-width: 960px) { .hero { grid-template-columns: 1fr; gap: 28px; } }

.pack { position: relative; isolation: isolate; background: var(--pack); color: var(--pack-ink); border-radius: var(--r-l); padding: 58px 44px 40px; gap: 36px; align-items: center; }
.pack::before { content: ""; position: absolute; top: 18px; left: 50%; width: 92px; height: 20px; margin-left: -46px; border-radius: 999px; background: var(--bg); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .18); }
.pack .lede { color: var(--pack-ink-2); }
.pack .fine { color: var(--pack-ink-2); }
.pack .hero-title { color: var(--pack-ink); }
.pack .hero-title .hl { display: inline-block; margin-top: .12em; background: var(--die); color: var(--die-ink); padding: .06em .28em .12em; border-radius: 18px; rotate: -2.5deg; box-shadow: 0 10px 18px -12px rgba(0, 0, 0, .5); }
.pack .btn { background: var(--die); border-color: var(--die); color: var(--die-ink); }
.pack .btn.primary { background: var(--pack-ink); border-color: var(--pack-ink); color: var(--pack); box-shadow: none; }
.pack .btn.ghost { background: transparent; border-color: var(--pack-ink); color: var(--pack-ink); }
.pack a:not(.btn) { color: var(--pack-ink); text-decoration-color: var(--pack-ink); }
.pack :focus-visible { outline-color: var(--pack-ink); }
.stage3d { position: relative; min-width: 0; margin: 40px -14px 0 0; }
.peek { position: absolute; z-index: -1; width: 36%; pointer-events: none; padding: 6px; border-radius: 16px; }
.peek img { border-radius: 11px; }
.peek-a { --r: -9deg; left: -7%; top: 50%; width: 28%; }
.peek-b { --r: 11deg; right: -4%; bottom: 12%; width: 30%; }
.peek-c { --r: 6deg; left: 22%; top: -16%; width: 26%; }
.mascot { position: absolute; z-index: 2; top: 0; right: 4%; width: clamp(112px, 11.5vw, 166px); height: auto; translate: 0 -72%; pointer-events: none; user-select: none;
  filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .26));
  animation: slap .7s cubic-bezier(.2, .9, .3, 1.2) 1s backwards; }
.pack .console { rotate: 1.5deg; box-shadow: 0 2px 2px rgba(0, 0, 0, .1), 0 30px 50px -28px rgba(0, 0, 0, .55); animation: slap .8s cubic-bezier(.2, .9, .3, 1.2) .15s backwards; }
.pack .peek { animation: slap .7s cubic-bezier(.2, .9, .3, 1.2) backwards; }
.pack .peek-a { animation-delay: .55s; }
.pack .peek-b { animation-delay: .7s; }
.pack .peek-c { animation-delay: .4s; }
.pack .hero-title span { animation: rise .8s cubic-bezier(.16, 1, .3, 1) backwards; }
.pack .hero-title span:nth-child(2) { animation-delay: .07s; }
.pack .hero-title .hl { animation: slap .7s cubic-bezier(.2, .9, .3, 1.2) .3s backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(.4em); } }
.maker { display: grid; gap: 12px; width: 100%; }
.maker-box { background: var(--die); color: var(--die-ink); border-radius: 20px; padding: 6px 6px 8px; display: grid; gap: 4px; box-shadow: 0 14px 30px -18px rgba(0, 0, 0, .45); transition: box-shadow .2s; }
.maker-box:focus-within { box-shadow: 0 0 0 3px var(--pack-ink), 0 14px 30px -18px rgba(0, 0, 0, .45); }
.maker-box textarea { border: 0; background: transparent; color: var(--die-ink); resize: none; min-height: 0; padding: 10px 12px 4px; font-size: 1.125rem; line-height: 1.45; }
.maker-box textarea:focus { outline: none; }
.maker-box textarea::placeholder { color: #5d6670; }
.maker-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 0 4px; }
.maker-bar .seg { background: transparent; border-color: #cdd4dc; }
.maker-bar .seg button { padding: 7px 13px; font-size: .875rem; color: #3b434e; }
.maker-bar .seg button[aria-pressed="true"] { background: var(--die-ink); color: var(--die); }
.maker-bar .btn { min-height: 46px; padding-inline: 20px; font-size: 1rem; }
.pack .maker-bar .btn.primary { background: var(--pack); border-color: var(--pack); color: var(--pack-ink); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); }
.maker-ideas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; }
.maker-ideas .fine { margin-right: 4px; font-weight: 700; }
.pack .maker-ideas .chip { background: transparent; border-color: var(--pack-ink); color: var(--pack-ink); font-size: .8125rem; padding: 7px 11px; }
.pack .maker-ideas .chip:hover { background: var(--die); border-color: var(--die); color: var(--die-ink); }
@media (max-width: 960px) {
  .pack { padding: 52px 22px 26px; }
  .stage3d { margin: 64px -6px 0; }
  .peek { display: none; }
  .mascot { width: 96px; right: 12px; translate: 0 -72%; }
  .pack .console { rotate: 0deg; }
}
@media (max-width: 560px) {
  .pack { border-radius: 22px; margin-inline: -6px; padding-inline: 16px; }
  .maker-ideas { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; }
  .maker-ideas::-webkit-scrollbar { display: none; }
  .maker-ideas .fine { flex: none; }
  .pack .hero-title .hl { border-radius: 12px; }
}

.console { position: relative; margin: 0; background: var(--die); color: var(--die-ink); border-radius: 26px; padding: 10px 10px 12px; display: grid; gap: 10px; box-shadow: 0 2px 2px rgba(0, 0, 0, .08), 0 18px 34px -20px var(--shadow); min-width: 0; }
.console .screen { border: 0; border-radius: 18px; box-shadow: none; }
.console-cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; padding: 0 8px; font-size: .875rem; color: #3b434e; }
.console-cap b, .console-cap a { color: var(--die-ink); }
.console-cap a { font-weight: 700; text-decoration-color: var(--die-ink); }
.console :focus-visible { outline-color: var(--die-ink); }

/* ---------- front page sections ---------- */
.sheet { --behind: var(--sheet); background: var(--sheet); border-radius: var(--r-l); padding: 34px 30px 30px; }
@media (max-width: 560px) { .sheet { padding: 20px 14px 18px; margin-inline: -6px; border-radius: 20px; } }

.flow { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 32px 56px; align-items: start; }
.flow-intro { display: grid; gap: 16px; position: sticky; top: 96px; justify-items: start; }
.flow-list { list-style: none; display: grid; }
.flow-list li { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 4px 20px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.flow-list li:first-child { padding-top: 4px; }
.flow-list b { font: 400 1.25rem/1.2 var(--display); }
.flow-list p { color: var(--ink-2); }
@media (max-width: 860px) { .flow { grid-template-columns: 1fr; } .flow-intro { position: static; } }
@media (max-width: 520px) { .flow-list li { grid-template-columns: 1fr; } }

.ways { display: grid; gap: 0; border-top: 1px solid var(--line); }
.way { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); grid-template-rows: auto 1fr; gap: 6px 48px; padding: 26px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.way > * { grid-column: 1; }
.way > ul, .way > .btn { grid-column: 2; grid-row: 1 / span 2; align-self: start; }
.way h3 { font: 400 clamp(1.375rem, 2.4vw, 1.875rem)/1.1 var(--display); }
.way p { color: var(--ink-2); }
.way .btn { justify-self: start; }
@media (max-width: 760px) { .way { grid-template-columns: 1fr; } .way > ul, .way > .btn { grid-column: 1; grid-row: auto; margin-top: 8px; } }

.steps { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.steps li { display: grid; gap: 6px; align-content: start; min-width: 0; }
.steps b { font: 400 1.125rem/1.15 var(--display); }
.steps p { color: var(--ink-2); font-size: .9375rem; }
@media (max-width: 960px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }

.earn { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px 48px; align-items: start; }
@media (max-width: 860px) { .earn { grid-template-columns: 1fr; } }
.earn .panel { border: 0; border-radius: var(--r-l); padding: 26px; box-shadow: 0 1px 1px rgba(0, 0, 0, .06), 0 18px 34px -24px var(--shadow); }
.splitbar { display: flex; gap: 4px; height: 44px; }
.splitbar i { display: block; min-width: 8px; border-radius: 10px; }
.seg-you { background: var(--pack); }
.seg-parent { background: var(--gold); }
.seg-grand { background: var(--seg-3); }
.seg-fee { background: var(--muted); }
.splitbar .seg-you { box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .12); }
.legend { list-style: none; display: grid; gap: 10px; }
.legend li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .9375rem; }
.legend i { width: 16px; height: 16px; border-radius: 50%; display: block; }
.legend b { font: 700 .875rem var(--body); font-variant-numeric: tabular-nums; }
.earn-list { list-style: none; display: grid; gap: 0; }
.earn-list li { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.earn-list li:first-child { padding-top: 0; }
.earn-list b { font: 400 1.0625rem/1.3 var(--display); }
.earn-list span { color: var(--ink-2); }
@media (max-width: 520px) { .earn-list li { grid-template-columns: 1fr; gap: 2px; } }

.table-scroll { overflow-x: auto; }
.table-scroll .spec { min-width: 560px; }

.feature-grid { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; }
.feature-grid li { display: grid; gap: 4px; padding: 16px 0; border-top: 1px solid var(--line); align-content: start; }
.feature-grid b { font-weight: 700; font-size: 1.0625rem; }
.feature-grid span { color: var(--ink-2); font-size: .9375rem; }
@media (max-width: 640px) { .feature-grid { grid-template-columns: 1fr; } }
.access { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 18px 56px; align-items: start; }
.access .access-intro { display: grid; gap: 14px; justify-items: start; }
@media (max-width: 860px) { .access { grid-template-columns: 1fr; } }

.road { list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border-top: 3px solid var(--ink); }
.stage { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 26px 18px 6px 0; min-width: 0; }
.stage::before { content: ""; position: absolute; top: -10px; left: 0; width: 17px; height: 17px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 3px var(--ink); }
.stage.now::before { background: var(--pack); box-shadow: inset 0 0 0 3px var(--ink), 0 0 0 4px var(--die); }
.stage-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 0; }
.stage-top:empty { display: none; }
.stage b { font: 400 1.125rem/1.15 var(--display); }
.stage p { font-size: .9rem; color: var(--ink-2); }
.stage .gate { display: grid; gap: 2px; margin-top: auto; padding-top: 10px; font-size: .85rem; color: var(--ink); }
.stage .gate span { font-weight: 700; font-size: .8125rem; color: var(--muted); }
@media (max-width: 1080px) { .road { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 28px; } }
@media (max-width: 680px) { .road { grid-template-columns: 1fr; border-top: 0; border-left: 3px solid var(--ink); padding-left: 22px; row-gap: 8px; } .stage { padding: 4px 0 14px; } .stage::before { top: 6px; left: -32px; } }

.faq { display: grid; max-width: 56rem; gap: 8px; }
.faq details { background: var(--panel); border-radius: var(--r-m); border: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 18px; font-weight: 700; font-size: 1.0625rem; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--pack); color: var(--pack-ink); font: 700 1.25rem/1 var(--body); flex: none; transition: rotate .3s cubic-bezier(.34, 1.56, .64, 1); }
.faq details[open] summary::after { rotate: 45deg; }
.faq details p { padding: 0 18px 18px; color: var(--ink-2); max-width: 44em; }

.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 18px 40px; }
.page-head h1 { font: 400 clamp(2rem, 4.2vw, 3.25rem)/1.05 var(--display); }
.page-head .lede { max-width: 40em; }
.contact { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 700; }
.contact b { font-size: .875rem; user-select: all; }
.closing .panel { padding: 28px; border-radius: var(--r-l); }
.closing h2 { font: 400 1.5rem/1.15 var(--display); }

/* ---------- cartridges (stickers on a sheet) ---------- */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 34px 26px; }
.cart { display: grid; gap: 10px; align-content: start; color: var(--ink); text-decoration: none; cursor: pointer; border-radius: 20px; }
.cart.in .sticker { animation: slap .7s cubic-bezier(.2, .9, .3, 1.2) calc(var(--i, 0) * 70ms) backwards; }
.cart:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
.cart:hover .sticker, .cart:focus-visible .sticker { transform: translateY(-6px) scale(1.02); rotate: 0deg; box-shadow: 0 1px 1px rgba(0, 0, 0, .08), 0 22px 30px -18px var(--shadow); }
.cart:hover .sticker::after, .cart:focus-visible .sticker::after { width: 34px; height: 34px; }
.cart:active .sticker { transform: translateY(-2px); transition-duration: .1s; }
.cart-body { display: contents; }
.cart-label { display: contents; }
.cart-title { font: 400 1.0625rem/1.15 var(--display); overflow-wrap: anywhere; padding: 4px 4px 0; }
.cart-by { padding: 0 4px; font-size: .875rem; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; margin-top: -4px; }
.cart-by b { font-weight: 700; color: var(--ink); }
.cart-tags { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 4px; }
.cart-tags:empty { display: none; }
.cart-serial, .cart-grip { display: none; }
@media (max-width: 520px) {
  .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; }
  .sticker { padding: 5px; border-radius: 15px; }
  .sticker img { border-radius: 10px; }
  .cart-title { font-size: .9375rem; }
  .cart-by { font-size: .78125rem; flex-wrap: wrap; gap: 0 6px; }
}
.empty { border: 2px dashed var(--line); border-radius: var(--r-m); padding: 28px; display: grid; gap: 10px; justify-items: start; color: var(--ink-2); }
.empty h1, .empty h2, .empty h3 { font: 400 1.125rem/1.2 var(--display); color: var(--ink); }

/* ---------- screen ---------- */
.screen { position: relative; background: #05070a; border: 8px solid var(--die); border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 2px 2px rgba(0, 0, 0, .08), 0 16px 30px -20px var(--shadow); max-width: 100%; }
.screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #05070a; }
.rate { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.star { background: transparent; border: 1px solid transparent; border-radius: var(--r-s); min-width: 40px; min-height: 40px; font-size: 1.375rem; line-height: 1; color: var(--ink); cursor: pointer; padding: 0 4px; }
.star:hover, .star[aria-pressed="true"] { border-color: var(--line); }
.mp-split { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--die); }
.mp-split > div { position: relative; min-width: 0; }
.screen-cover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 7, 10, .5); border: 0; cursor: pointer; color: #fff; padding: 0; }
.screen-cover span { display: inline-flex; align-items: center; gap: 10px; background: #c6ef3a; color: #141a0c; font: 700 1.0625rem/1 var(--body); padding: 14px 22px; border-radius: 999px; box-shadow: 0 0 0 3px #fff; }
.screen:fullscreen { border: 0; border-radius: 0; aspect-ratio: auto; }
@media (max-width: 640px) { .screen { aspect-ratio: 4 / 5; border-width: 6px; border-radius: 18px; } .console .screen { aspect-ratio: 1 / 1; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- game page ---------- */
.gp-head { display: grid; gap: 10px; margin-bottom: 20px; justify-items: start; }
.gp-head h1 { font: 400 clamp(1.875rem, 3.8vw, 2.75rem)/1.06 var(--display); }
.gp-head > p.muted { max-width: 62ch; }
.gp-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 26px; align-items: start; }
.gp-main { display: grid; gap: 14px; min-width: 0; }
.gp-side { display: grid; gap: 14px; min-width: 0; }
@media (max-width: 960px) { .gp-grid { grid-template-columns: 1fr; } }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--panel-2); border-radius: 999px; overflow-x: auto; scrollbar-width: none; justify-self: start; max-width: 100%; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; font-weight: 700; font-size: .875rem; color: var(--ink-2); border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--panel); box-shadow: 0 2px 6px -2px var(--shadow); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 14px; font-size: .875rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.hash { font: 500 .75rem/1.5 var(--mono); overflow-wrap: anywhere; color: var(--ink-2); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 118px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: .84375rem; }
.bar i { display: block; height: 12px; background: var(--accent); border-radius: 6px; }
.bar i.p { background: var(--gold); }
.bar i.f { background: var(--muted); }
.bar em { font-style: normal; text-align: right; font: 500 .75rem var(--mono); }
.lineage { display: grid; gap: 6px; }
.lineage a { display: flex; gap: 8px; align-items: center; text-decoration: none; color: var(--ink); font-weight: 700; }
.lineage .pipe { width: 2px; height: 14px; background: var(--line); margin-left: 9px; }

/* ---------- tables ---------- */
.spec { border-radius: var(--r-m); background: var(--panel); overflow: hidden; border: 1px solid var(--line); }
.spec table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
.spec th, .spec td { padding: 14px 16px; text-align: left; vertical-align: top; }
.spec tbody tr + tr th, .spec tbody tr + tr td { border-top: 1px solid var(--line); }
.spec thead th { font: 700 .875rem var(--body); color: var(--ink-2); }
.spec thead th:last-child { font: 400 1rem var(--display); color: var(--pack-ink); background: var(--pack); }
.spec tbody th { font-weight: 700; width: 22%; }
.spec td.us { color: var(--ink); font-weight: 700; background: var(--accent-soft); }
.spec td.them { color: var(--ink-2); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--panel); }
table.data { border-collapse: collapse; width: 100%; font-size: .875rem; }
table.data th { text-align: left; font: 700 .8125rem var(--body); color: var(--ink-2); padding: 11px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.r, table.data th.r { text-align: right; }
table.data td.n { font: 500 .78125rem var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover td { background: var(--panel-2); }
table.data tr.detail td { background: var(--panel-2); }
pre.code { margin: 0; font: 500 .75rem/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px; max-height: 340px; overflow: auto; }

/* ---------- studio ---------- */
.studio { display: grid; grid-template-columns: minmax(320px, .95fr) minmax(0, 1.25fr); gap: 26px; align-items: start; }
.studio > * { min-width: 0; }
@media (max-width: 960px) { .studio { grid-template-columns: 1fr; } .studio .st-right { order: -1; } }
.st-right { position: sticky; top: 76px; display: grid; gap: 12px; }
@media (max-width: 960px) { .st-right { position: static; } }
.chat { display: grid; gap: 10px; max-height: 340px; overflow: auto; padding-right: 4px; }
.msg { padding: 10px 14px; border-radius: 16px; font-size: .90625rem; border: 1px solid var(--line); background: var(--bg); }
.msg.me { background: var(--accent-soft); border-color: transparent; justify-self: end; max-width: 92%; border-bottom-right-radius: 6px; }
.msg.note { color: var(--muted); font-size: .84375rem; background: transparent; border-style: dashed; }
.stream { font: 500 .6875rem/1.5 var(--mono); color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px; max-height: 150px; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.kitpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.kitpick button { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: var(--r-s); padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.kitpick button b { font: 400 .9375rem/1.15 var(--display); }
.kitpick button small { color: var(--muted); font-size: .78125rem; line-height: 1.35; }
.kitpick button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--panel); }
.knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 18px; }
.banner { border: 1.5px solid var(--line); border-radius: var(--r-m); padding: 12px 16px; background: var(--panel); display: grid; gap: 8px; font-size: .90625rem; }
.banner.bad { border-color: var(--bad); }
.banner.warn { border-color: var(--warn); }
.banner.info { border-color: var(--accent); }
.versions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- wallet / economy ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.balance { display: grid; gap: 6px; }

<script>
/* GamePlay core: encoding, Ed25519, hashing, ledger rules and the world model.
   Everything here is pure logic so it can be tested outside the browser. */
(function (root) {
  'use strict';

  const enc = new TextEncoder();
  const utf8 = (s) => enc.encode(s);
  const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  const concat = (...arrs) => {
    const n = arrs.reduce((s, a) => s + a.length, 0);
    const o = new Uint8Array(n);
    let k = 0;
    for (const a of arrs) { o.set(a, k); k += a.length; }
    return o;
  };
  const randBytes = (n) => { const b = new Uint8Array(n); root.crypto.getRandomValues(b); return b; };
  const randHex = (n) => hex(randBytes(n));
  const subtle = root.crypto && root.crypto.subtle;

  /* ---------- base58 (Solana / Bitcoin alphabet) ---------- */
  const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function b58enc(bytes) {
    let n = 0n;
    for (const b of bytes) n = n * 256n + BigInt(b);
    let s = '';
    while (n > 0n) { s = B58[Number(n % 58n)] + s; n /= 58n; }
    for (const b of bytes) { if (b === 0) s = '1' + s; else break; }
    return s;
  }
  function b58dec(str) {
    let n = 0n;
    for (const c of str) {
      const i = B58.indexOf(c);
      if (i < 0) throw new Error('Not a base58 string');
      n = n * 58n + BigInt(i);
    }
    const out = [];
    while (n > 0n) { out.unshift(Number(n % 256n)); n /= 256n; }
    for (const c of str) { if (c === '1') out.unshift(0); else break; }
    return new Uint8Array(out);
  }

  /* ---------- hashing ---------- */
  async function sha256hex(data) {
    const b = typeof data === 'string' ? utf8(data) : data;
    return hex(new Uint8Array(await subtle.digest('SHA-256', b)));
  }
  async function sha512(b) { return new Uint8Array(await subtle.digest('SHA-512', b)); }

  /* ---------- Ed25519: native WebCrypto with a pure-JS fallback ---------- */
  const ed = (() => {
    let nativeP = null;
    function hasNative() {
      if (!nativeP) {
        nativeP = (async () => {
          try {
            const k = await subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
            const m = utf8('probe');
            const s = await subtle.sign({ name: 'Ed25519' }, k.privateKey, m);
            return await subtle.verify({ name: 'Ed25519' }, k.publicKey, s, m);
          } catch (e) { return false; }
        })();
      }
      return nativeP;
    }

    // Pure-JS fallback (RFC 8032). Not constant-time; fine for a devnet prototype.
    const P = 2n ** 255n - 19n;
    const N = 2n ** 252n + 27742317777372353535851937790883648493n;
    const mod = (a, m = P) => { const r = a % m; return r >= 0n ? r : r + m; };
    const pow = (b, e, m = P) => { let r = 1n; b = mod(b, m); while (e > 0n) { if (e & 1n) r = mod(r * b, m); b = mod(b * b, m); e >>= 1n; } return r; };
    const inv = (a) => pow(a, P - 2n);
    const D = mod(-121665n * inv(121666n));
    const SQRT_M1 = pow(2n, (P - 1n) / 4n);
    const leToNum = (b) => { let n = 0n; for (let i = b.length - 1; i >= 0; i--) n = (n << 8n) | BigInt(b[i]); return n; };
    const numToLE = (n, len) => { const o = new Uint8Array(len); for (let i = 0; i < len; i++) { o[i] = Number(n & 255n); n >>= 8n; } return o; };
    class Pt {
      constructor(X, Y, Z, T) { this.X = X; this.Y = Y; this.Z = Z; this.T = T; }
      static aff(x, y) { return new Pt(x, y, 1n, mod(x * y)); }
      add(o) {
        const A = mod((this.Y - this.X) * (o.Y - o.X));
        const B = mod((this.Y + this.X) * (o.Y + o.X));
        const C = mod(this.T * 2n * D * o.T);
        const DD = mod(this.Z * 2n * o.Z);
        const E = B - A, F = DD - C, G = DD + C, H = B + A;
        return new Pt(mod(E * F), mod(G * H), mod(F * G), mod(E * H));
      }
      mul(n) { let R = Pt.ZERO, Q = this; while (n > 0n) { if (n & 1n) R = R.add(Q); Q = Q.add(Q); n >>= 1n; } return R; }
      eq(o) { return mod(this.X * o.Z) === mod(o.X * this.Z) && mod(this.Y * o.Z) === mod(o.Y * this.Z); }
      bytes() {
        const zi = inv(this.Z), x = mod(this.X * zi), y = mod(this.Y * zi);
        const b = numToLE(y, 32);
        if (x & 1n) b[31] |= 0x80;
        return b;
      }
      static from(bytes) {
        const b = bytes.slice();
        const odd = (b[31] & 0x80) !== 0;
        b[31] &= 0x7f;
        const y = leToNum(b);
        if (y >= P) throw new Error('bad point');
        const y2 = mod(y * y), u = mod(y2 - 1n), v = mod(D * y2 + 1n);
        const v3 = mod(v * v * v), v7 = mod(v3 * v3 * v);
        let x = mod(u * v3 * pow(mod(u * v7), (P - 5n) / 8n));
        const vx2 = mod(v * x * x);
        if (vx2 === mod(-u)) x = mod(x * SQRT_M1);
        else if (vx2 !== mod(u)) throw new Error('bad point');
        if ((x & 1n) !== (odd ? 1n : 0n)) x = mod(-x);
        return Pt.aff(x, y);
      }
    }
    Pt.ZERO = new Pt(0n, 1n, 1n, 0n);
    Pt.BASE = Pt.aff(
      15112221349535400772501151409588531511454012693041857206046113283949847762202n,
      46316835694926478169428394003475163141307993866256225615783033603165251855960n
    );
    async function jsKeyFromSeed(seed) {
      const h = await sha512(seed);
      const a = h.slice(0, 32);
      a[0] &= 248; a[31] &= 127; a[31] |= 64;
      const s = leToNum(a);
      return { s, prefix: h.slice(32), pub: Pt.BASE.mul(s).bytes() };
    }
    async function jsSign(seed, msg) {
      const k = await jsKeyFromSeed(seed);
      const r = mod(leToNum(await sha512(concat(k.prefix, msg))), N);
      const R = Pt.BASE.mul(r).bytes();
      const h = mod(leToNum(await sha512(concat(R, k.pub, msg))), N);
      const S = mod(r + h * k.s, N);
      return concat(R, numToLE(S, 32));
    }
    async function jsVerify(pub, msg, sig) {
      try {
        if (sig.length !== 64 || pub.length !== 32) return false;
        const R = Pt.from(sig.slice(0, 32)), A = Pt.from(pub);
        const S = leToNum(sig.slice(32));
        if (S >= N) return false;
        const h = mod(leToNum(await sha512(concat(sig.slice(0, 32), pub, msg))), N);
        return Pt.BASE.mul(S).eq(R.add(A.mul(h)));
      } catch (e) { return false; }
    }

    const PKCS8_PREFIX = new Uint8Array([0x30, 0x2e, 0x02, 0x01, 0x00, 0x30, 0x05, 0x06, 0x03, 0x2b, 0x65, 0x70, 0x04, 0x22, 0x04, 0x20]);
    const pubKeyCache = new Map();

    async function generate() {
      if (await hasNative()) {
        const k = await subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
        const pkcs8 = new Uint8Array(await subtle.exportKey('pkcs8', k.privateKey));
        const seed = pkcs8.slice(pkcs8.length - 32);
        const pub = new Uint8Array(await subtle.exportKey('raw', k.publicKey));
        return { seed, pub, secret64: concat(seed, pub) };
      }
      const seed = randBytes(32);
      const pub = (await jsKeyFromSeed(seed)).pub;
      return { seed, pub, secret64: concat(seed, pub) };
    }
    async function pubFromSeed(seed) { return (await jsKeyFromSeed(seed)).pub; }

    /* A signer from a 64-byte Solana-style secret key (seed || pubkey). */
    async function signer(secret64) {
      const seed = secret64.slice(0, 32);
      const pub = secret64.slice(32, 64);
      const pk = b58enc(pub);
      let key = null;
      if (await hasNative()) {
        key = await subtle.importKey('pkcs8', concat(PKCS8_PREFIX, seed), { name: 'Ed25519' }, false, ['sign']);
      }
      return {
        pk,
        async sign(msg) {
          const sig = key ? new Uint8Array(await subtle.sign({ name: 'Ed25519' }, key, msg)) : await jsSign(seed, msg);
          return b58enc(sig);
        },
      };
    }
    async function verify(pkB58, msg, sigB58) {
      let pub, sig;
      try { pub = b58dec(pkB58); sig = b58dec(sigB58); } catch (e) { return false; }
      if (pub.length !== 32 || sig.length !== 64) return false;
      if (await hasNative()) {
        try {
          let key = pubKeyCache.get(pkB58);
          if (!key) {
            key = await subtle.importKey('raw', pub, { name: 'Ed25519' }, false, ['verify']);
            pubKeyCache.set(pkB58, key);
          }
          return await subtle.verify({ name: 'Ed25519' }, key, sig, msg);
        } catch (e) { /* fall through to JS */ }
      }
      return jsVerify(pub, msg, sig);
    }
    return { generate, signer, verify, hasNative, pubFromSeed, _js: { jsSign, jsVerify, jsKeyFromSeed } };
  })();

  /* ---------- canonical messages ---------- */
  function canon(v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
    return '{' + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  }
  const DOMAIN = 'GAMEPLAY/v1';
  function txMessage(tx) {
    const { sig, ...rest } = tx;
    return utf8(DOMAIN + '\n' + canon(rest));
  }
  function delegationMessage(main, session, exp) {
    return DOMAIN + ' SESSION\nmain:' + main + '\nsession:' + session + '\nexp:' + exp;
  }
  function epochMessage(ep) {
    const { sig, ...rest } = ep;
    return utf8(DOMAIN + ' EPOCH\n' + canon(rest));
  }

  /* ---------- economy rules ---------- */
  const LAMPORTS = 1e9;
  const RULES = Object.freeze({
    AIRDROP_LAMPORTS: 2 * LAMPORTS,
    AIRDROP_EVERY_MS: 24 * 3600 * 1000,
    WEEKLY_SPARKS: 150,
    GEN_COST: { new: 12, edit: 4, fix: 0 },
    SPARK_PACK: { lamports: 0.02 * LAMPORTS, sparks: 100 },
    SPARKS_PER_PLAYER: 3,
    SPARKS_PLAYER_CAP: 100,
    FEE_BPS: 500,
    PARENT_BPS: 1000,
    GRAND_BPS: 500,
    CONVERT: { park: 20, sparks: 10 },
    EPOCH_BASE: 100000,
    EPOCH_DECAY: 0.9,
    CREATOR_SHARE: 0.7,
    PLAYER_SHARE: 0.3,
    SOL_REV_SHARE: 0.4,
    MAX_SUPPLY: 1000000000,
    MAX_SCORE: 1e9,
    MAX_PRICE_LAMPORTS: 100 * LAMPORTS,
  });
  const emissionFor = (n) => Math.floor(RULES.EPOCH_BASE * Math.pow(RULES.EPOCH_DECAY, Math.max(0, n - 1)));
  const TREASURY = 'TREASURY';
  const STARTER = 'STARTER';

  function weekKey(ts) {
    const d = new Date(ts);
    const day = (d.getUTCDay() + 6) % 7;
    const thursday = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day + 3));
    const firstThursday = new Date(Date.UTC(thursday.getUTCFullYear(), 0, 4));
    const week = 1 + Math.round(((thursday - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
    return thursday.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
  }

  /* Split a collect payment: protocol fee, then lineage royalties, rest to creator. */
  function collectSplits(price, game, games) {
    const out = [];
    const fee = Math.floor(price * RULES.FEE_BPS / 10000);
    out.push({ to: TREASURY, amt: fee, role: 'protocol' });
    let rest = price - fee;
    const parent = game.parent && games.get(game.parent);
    if (parent && parent.creator !== STARTER) {
      const p = Math.floor(price * RULES.PARENT_BPS / 10000);
      out.push({ to: parent.creator, amt: p, role: 'parent' });
      rest -= p;
      const grand = parent.parent && games.get(parent.parent);
      if (grand && grand.creator !== STARTER) {
        const g = Math.floor(price * RULES.GRAND_BPS / 10000);
        out.push({ to: grand.creator, amt: g, role: 'grandparent' });
        rest -= g;
      }
    }
    out.unshift({ to: game.creator, amt: rest, role: 'creator' });
    return out;
  }

  /* ---------- real-network payments ---------- */
  /* On a real Solana network (input.chain in buildWorld), a collect or tip counts only when its
     b.chain names a confirmed Solana transaction that the payer signed, that carries the memo
     "gameplay:<ledger id>", and that pays every expected destination at least its share.
     p is a lookup result: { ok, signer, transfers: [{ from, to, lamports }], memos }. */
  function checkPayment(p, payer, expect, memo) {
    if (!p) return 'Payment not found on Solana yet';
    if (!p.ok) return 'Payment failed on Solana';
    if (p.signer !== payer) return 'Payment was not signed by this wallet';
    if (!(p.memos || []).some((m) => m === memo)) return 'Payment is not linked to this action';
    const paid = new Map(), want = new Map();
    for (const t of p.transfers || []) if (t.from === payer) paid.set(t.to, (paid.get(t.to) || 0) + t.lamports);
    for (const e of expect) if (e.amt > 0) want.set(e.to, (want.get(e.to) || 0) + e.amt);
    for (const [to, amt] of want) if ((paid.get(to) || 0) < amt) return 'Payment is short';
    return null;
  }

  /* ---------- verification with a cache ---------- */
  const sigCache = new Map();
  async function verifyTx(tx) {
    const key = tx.id + ':' + tx.sig;
    if (sigCache.has(key)) return sigCache.get(key);
    let ok = false, why = 'Bad signature';
    try {
      if (!tx.sig || !tx.pk || !tx.from) { why = 'Missing signature fields'; }
      else if (tx.pk === tx.from && !tx.del) {
        ok = await ed.verify(tx.pk, txMessage(tx), tx.sig);
      } else if (tx.del && tx.del.m === tx.from && tx.del.s === tx.pk) {
        const dOk = await ed.verify(tx.del.m, utf8(delegationMessage(tx.del.m, tx.del.s, tx.del.exp)), tx.del.sig);
        if (!dOk) why = 'Bad session delegation';
        else if (tx.ts > tx.del.exp) why = 'Session key expired';
        else ok = await ed.verify(tx.pk, txMessage(tx), tx.sig);
      } else { why = 'Signer is not the account owner'; }
    } catch (e) { ok = false; }
    const res = ok ? { ok: true } : { ok: false, why };
    sigCache.set(key, res);
    return res;
  }
  async function verifyEpoch(ep, config) {
    const list = config ? (config.authorities || (config.authority ? [config.authority] : [])) : [];
    if (!list.includes(ep.pk)) return { ok: false, why: 'Not signed by the protocol authority' };
    const key = 'ep:' + ep.n + ':' + ep.sig;
    if (sigCache.has(key)) return sigCache.get(key);
    const ok = await ed.verify(ep.pk, epochMessage(ep), ep.sig);
    const res = ok ? { ok: true } : { ok: false, why: 'Bad epoch signature' };
    sigCache.set(key, res);
    return res;
  }

  /* ---------- the world: replay every signed transaction in order ---------- */
  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : NaN);
  const cleanText = (s, max) => String(s == null ? '' : s).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, max);

  async function buildWorld(input) {
    const { accounts = [], protocol = {}, starters = [] } = input;
    // chain: { treasury, lookup(sigs) -> Map(sig -> result) } when payments run on a real network.
    const chain = input.chain || null;
    const now = input.now || Date.now();
    const config = protocol.config || null;
    const delisted = (protocol.moderation && protocol.moderation.delisted) || {};

    const entries = [];
    const seen = new Set();
    for (const acc of accounts) {
      for (const tx of (acc.doc && acc.doc.txs) || []) {
        if (!tx || !tx.id || seen.has(tx.id)) continue;
        seen.add(tx.id);
        entries.push({ kind: 'tx', tx, uid: acc.uid, local: !!acc.local });
      }
    }
    for (const ep of protocol.epochs || []) entries.push({ kind: 'epoch', tx: ep, uid: '@protocol' });
    await Promise.all(entries.map(async (e) => {
      e.v = e.kind === 'epoch' ? await verifyEpoch(e.tx, config) : await verifyTx(e.tx);
    }));
    let paid = new Map();
    const usedSigs = new Set();
    if (chain) {
      const sigs = entries.filter((e) => (e.tx.t === 'collect' || e.tx.t === 'tip') && e.tx.b && typeof e.tx.b.chain === 'string').map((e) => e.tx.b.chain);
      if (sigs.length) paid = (await chain.lookup([...new Set(sigs)])) || new Map();
    }
    const payCheck = (tx, expect) => {
      const sig = tx.b.chain;
      if (typeof sig !== 'string' || !/^[1-9A-HJ-NP-Za-km-z]{64,90}$/.test(sig)) return 'Missing Solana payment';
      if (usedSigs.has(sig)) return 'Payment already used';

/* GamePlay on Solana: builds and reads the one kind of transaction GamePlay sends, a payment made of
   System Program transfers plus a memo that ties it to a GamePlay ledger entry. No libraries: the

  'use strict';
  const C = root.PPCore;
  const SYSTEM = '11111111111111111111111111111111';
  const MEMO = 'MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr';
  // Wallet apps may add a priority fee before signing; that only spends the payer's own fee.
  const COMPUTE = 'ComputeBudget111111111111111111111111111111';

  const MAX_TX = 1232;

  function isAddress(s) {
    if (typeof s !== 'string' || s.length < 32 || s.length > 44) return false;
    try { return C.b58dec(s).length === 32; } catch (e) { return false; }
  }
  function shortvec(n) {

    do { let b = n & 0x7f; n >>>= 7; if (n) b |= 0x80; out.push(b); } while (n);
    return out;
  }
  function readShortvec(bytes, at) {
    let n = 0, shift = 0, b;

    return n;

    let x = BigInt(v);

    return out;
  }

     transfers: [{ to, lamports }] (same destination may repeat; amounts are summed). */
  function buildPayment({ payer, transfers, memo, blockhash }) {
    if (!isAddress(payer)) throw new Error('Bad payer address');
    if (!isAddress(blockhash)) throw new Error('Bad blockhash');
    const sums = new Map();
    for (const t of transfers || []) {
      if (!isAddress(t.to)) throw new Error('Bad destination address');
      const l = Math.floor(Number(t.lamports));
      if (!(l > 0) || !Number.isSafeInteger(l)) continue;
      sums.set(t.to, (sums.get(t.to) || 0) + l);
    }
    if (!sums.size) throw new Error('Nothing to pay');
    // Account order: the signer, writable destinations, then the read-only programs.
    const writable = [...sums.keys()].filter((k) => k !== payer);
    const keys = [payer, ...writable, SYSTEM].concat(memo ? [MEMO] : []);
    const idx = (k) => keys.indexOf(k);
    const ix = [];
    for (const [to, lamports] of sums) {
      ix.push([idx(SYSTEM), ...shortvec(2), 0, idx(to), ...shortvec(12), 2, 0, 0, 0, ...u64le(lamports)]);
    }

      const data = C.utf8(String(memo));
      if (data.length > 256) throw new Error('Memo too long');
      ix.push([idx(MEMO), ...shortvec(0), ...shortvec(data.length), ...data]);

    const parts = [1, 0, memo ? 2 : 1, ...shortvec(keys.length)];
    for (const k of keys) parts.push(...C.b58dec(k));

  function parsePayment(bytes) {
    if (!(bytes instanceof Uint8Array) || bytes.length > MAX_TX) throw new Error('Bad transaction size');
    const at = { i: 0 };

      const prog = keys[bytes[at.i++]];
      const nAcc = readShortvec(bytes, at);

      for (let a = 0; a < nAcc; a++) accs.push(keys[bytes[at.i++]]);

  /* ---------------- Solana network ----------------
     When server/server.mjs runs with GP_SOLANA_CLUSTER, GP_SITE.chain is set and collects and tips are
     real Solana payments: the player's wallet pays the creator, the lineage and the treasury directly
     (ClaudePlay never holds funds), the memo "gameplay:<ledger id>" ties the payment to its ledger entry,
     and every page checks the payment on Solana before the entry counts. Without it, the ledger keeps
     its simulated devSOL balances. */
  const SOLN = window.PPSolana;
  const CHAIN = SITE.chain && SITE.chain.api && SOLN.CLUSTERS.includes(SITE.chain.cluster) && SOLN.isAddress(SITE.chain.treasury || '') ? SITE.chain : null;
  const MAINNET = !!CHAIN && CHAIN.cluster === 'mainnet-beta';
  const UNIT = MAINNET ? 'SOL' : 'devSOL';
  const RENT_MIN = 890880; // lamports a brand-new Solana account must receive to exist
  const CHAIN_DROP = 1e9; // what the server's devnet/testnet faucet drops
  const b64 = (bytes) => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); };
  async function chainApi(path, body) {
    const res = await fetch(CHAIN.api.replace(/\/?$/, '/') + path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.message || 'Solana did not answer. Try again.');
    return j;
  }
  const paySeen = new Map(), payMiss = new Map();
  async function chainLookup(sigs) {
    const now = Date.now();
    const ask = sigs.filter((s) => !paySeen.has(s) && (payMiss.get(s) || 0) < now - 5000);
    for (let i = 0; i < ask.length; i += 100) {
      const part = ask.slice(i, i + 100);
      try {
        const { txs } = await chainApi('txs', { sigs: part });
        for (const s of part) { if (txs && txs[s]) paySeen.set(s, txs[s]); else payMiss.set(s, now); }
      } catch (e) { /* unknown for now: those entries wait for the next refresh */ }
    }
    return new Map(sigs.filter((s) => paySeen.has(s)).map((s) => [s, paySeen.get(s)]));
  }
  const worldChain = CHAIN ? { treasury: CHAIN.treasury, lookup: chainLookup } : null;
  /* Balance: on a real network it is read from Solana; otherwise it is the simulated ledger's. */
  const solOf = (w) => (CHAIN ? S.chainBal || 0 : w ? w.sol : 0);
  async function loadChainBal() {
    if (!CHAIN || !S.wallet) return;
    try { S.chainBal = (await chainApi('balance/' + S.wallet.from)).lamports; renderHeader(); } catch (e) { /* keep the last value */ }
  }
  /* Wallet Standard: wallet apps announce themselves to the page. */
  const STD = [];
  (function discoverWallets() {
    const api = { register: (...ws) => { for (const w of ws) if (w && w.features && !STD.includes(w)) STD.push(w); return () => {}; } };
    window.addEventListener('wallet-standard:register-wallet', (e) => { try { e.detail(api); } catch (err) { /* ignore */ } });
    try { window.dispatchEvent(new CustomEvent('wallet-standard:app-ready', { detail: api })); } catch (e) { /* ignore */ }
  })();
  async function injectedPay(message) {
    const main = S.wallet.from;
    const unsigned = SOLN.serializeTx(message);
    const chainId = 'solana:' + (MAINNET ? 'mainnet' : CHAIN.cluster);
    const canPay = (w) => w.features['solana:signTransaction'] || w.features['solana:signAndSendTransaction'];
    const std = STD.find((w) => canPay(w) && (w.accounts || []).some((a) => a.address === main))
      || STD.find((w) => canPay(w) && w.features['standard:connect'] && String(S.wallet.label).startsWith(w.name));
    if (std) {
      let acct = (std.accounts || []).find((a) => a.address === main);
      if (!acct && std.features['standard:connect']) {
        const r = await std.features['standard:connect'].connect();
        acct = ((r && r.accounts) || []).find((a) => a.address === main);
      }
      if (!acct) throw new Error('Switch your wallet app to ' + short(main) + ' and try again.');
      const st = std.features['solana:signTransaction'];
      if (st) {
        const [out] = await st.signTransaction({ account: acct, transaction: unsigned, chain: chainId });
        return (await chainApi('send', { tx: b64(new Uint8Array(out.signedTransaction)) })).signature;
      }
      const [out] = await std.features['solana:signAndSendTransaction'].signAndSendTransaction({ account: acct, transaction: unsigned, chain: chainId });
      return C.b58enc(new Uint8Array(out.signature));
    }
    const inj = injectedProvider();
    if (inj && typeof inj.p.request === 'function') {
      const r = await inj.p.request({ method: 'signAndSendTransaction', params: { message: C.b58enc(message) } });
      if (r && r.signature) return r.signature;
    }
    throw new Error('Your wallet app cannot pay from this page. Try Phantom, Solflare or Backpack.');
  }
  async function waitConfirmed(sig) {
    for (let i = 0; i < 60; i++) {
      const s = await chainApi('status/' + sig).catch(() => ({}));
      if (s.err) throw new Error('The payment failed on Solana.');
      if (s.status === 'confirmed' || s.status === 'finalized') return;
      await new Promise((r) => setTimeout(r, i < 10 ? 1000 : 2000));
    }
    throw new Error('Solana has not confirmed the payment yet. ClaudePlay will record it once it lands.');
  }
  /* Pays `transfers` ([{ to, amt }]) from the wallet with the memo for ledger entry `id`. */
  async function walletPay(transfers, id) {
    const payer = S.wallet.from;
    const list = transfers.filter((t) => t.amt > 0).map((t) => ({ to: t.to === C.TREASURY ? CHAIN.treasury : t.to, lamports: t.amt }));
    for (const t of list) {
      if (t.to === payer || t.lamports >= RENT_MIN) continue;
      const { lamports } = await chainApi('balance/' + t.to);
      if (!lamports) throw new Error(short(t.to) + ' has never been funded on Solana, and a first payment to a wallet must be at least ' + fmtSOL(RENT_MIN) + ' SOL. Pick a bigger amount.');
    }
    const { blockhash } = await chainApi('blockhash');
    const message = SOLN.buildPayment({ payer, transfers: list, memo: 'gameplay:' + id, blockhash });
    let sig;
    if (S.wallet.kind === 'embedded') {
      const s = await S.wallet.sign(message);
      sig = (await chainApi('send', { tx: b64(SOLN.serializeTx(message, s)) })).signature;

    return sig;
  }
  /* Collect or tip: check the action first with a stand-in payment, pay on Solana, then record it.

  /* The kind each account declared for a wallet ('embedded' keys live in one browser's storage). */
  function walletKind(addr) {
    for (const d of S.accounts.values()) if (d && d.wallets && d.wallets[addr]) return d.wallets[addr].kind;
    const mine = S.localAccount && S.localAccount.wallets && S.localAccount.wallets[addr];

  async function payAndAppend(type, body, transfers) {
    if (!CHAIN) return signAndAppend(type, body);
    if (MAINNET && S.wallet.kind === 'embedded') throw new Error('Real SOL is paid from your own wallet app. Connect Phantom, Solflare or Backpack in Wallet.');
    // Real SOL sent to a key kept in someone's browser storage is lost if they clear it.
    if (MAINNET && transfers.some((t) => t.amt > 0 && t.to !== C.TREASURY && walletKind(t.to) === 'embedded')) throw new Error('This creator has not connected a wallet app, so they cannot receive real SOL yet.');
    const id = C.randHex(8), stand = '1'.repeat(64), from = S.wallet.from;
    const dry = { treasury: CHAIN.treasury, lookup: async (sigs) => {
      const m = await chainLookup(sigs.filter((s) => s !== stand));
      m.set(stand, { ok: true, signer: from, transfers: transfers.map((t) => ({ from, to: t.to === C.TREASURY ? CHAIN.treasury : t.to, lamports: t.amt })), memos: ['gameplay:' + id] });
      return m;
    } };
    await signAndAppend(type, Object.assign({}, body, { chain: stand }), { id, chain: dry, dry: true });
    if (S.wallet.kind !== 'embedded') toast('Approve the payment in your wallet app.');
    const sig = await walletPay(transfers, id);
    const pend = LS.get(KEY.pending) || [];
    pend.push({ id, type, body: Object.assign({}, body, { chain: sig }), from, at: Date.now() });
    LS.set(KEY.pending, pend.slice(-20));
    await waitConfirmed(sig);
    const out = await signAndAppend(type, Object.assign({}, body, { chain: sig }), { id });
    LS.set(KEY.pending, (LS.get(KEY.pending) || []).filter((p) => p.id !== id));
    await loadChainBal();
    return out;

    const n = doc.txs.filter((t) => t.from === S.wallet.from).length + 1;

    const tx = { id: opts.id || C.randHex(8), t: type, from: S.wallet.from, pk: S.wallet.pk, ts: lastTs, n, b: body };
    if (S.wallet.del) tx.del = S.wallet.del;

    const w = await C.buildWorld({ accounts: worldAccounts(doc), protocol: protocol(), starters: S.starters, chain: opts.chain || worldChain });
    const rec = w.log.find((r) => r.tx.id === tx.id);

    if (opts.dry) return { tx, rec };

  /* The picture restyled for an art style, as { w, h, data } (PNG base64), small enough to send. */
  async function stylePic(raw, style) {
    const im = await loadImg(raw);
    let side = Math.max(im.naturalWidth, im.naturalHeight);
    if (style === 'Pixel art') side = Math.min(side, 32);
    for (;;) {
      const k = Math.min(1, side / Math.max(im.naturalWidth, im.naturalHeight));
      let c = canvasOf(Math.round(im.naturalWidth * k), Math.round(im.naturalHeight * k));
      const x = c.getContext('2d');
      x.drawImage(im, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        let r = px[i], g = px[i + 1], b = px[i + 2];
        const l = 0.299 * r + 0.587 * g + 0.114 * b;
        if (style === 'Pixel art') { const q = (v) => Math.round(v / 51) * 51; r = q(r); g = q(g); b = q(b); px[i + 3] = px[i + 3] < 128 ? 0 : 255; }
        else if (style === 'Monochrome ink') { r = g = b = l < 85 ? 17 : l < 170 ? 110 : 236; }
        else if (style === 'Neon arcade') { const s = 1.7; r = l + (r - l) * s + 20; g = l + (g - l) * s + 20; b = l + (b - l) * s + 20; }
        else if (style === 'Pastel cozy') { r = r * 0.6 + 102; g = g * 0.6 + 102; b = b * 0.6 + 102; }
        px[i] = Math.max(0, Math.min(255, r)); px[i + 1] = Math.max(0, Math.min(255, g)); px[i + 2] = Math.max(0, Math.min(255, b));
      }
      x.putImageData(d, 0, 0);
      if (style === 'Neon arcade') c = outlined(c, 2, '#3ff6ff');
      else if (style === 'Paper cutout') c = outlined(c, 3, '#ffffff', true);
      else if (style === 'Monochrome ink') c = outlined(c, 1, '#111111');
      const data = c.toDataURL('image/png').split(',')[1];
      if (data.length <= H.PICS.data && c.width <= H.PICS.side && c.height <= H.PICS.side) return { w: c.width, h: c.height, data };
      side = Math.floor(side * 0.8);
      if (side < 8) throw new Error('A picture is too detailed to use. Try a simpler one.');
    }

      + '<li><b>For crowds</b><p>Running a brand, a community or a class? <a href="#business" data-nav="business">ClaudePlay for business</a> makes branded games with leaderboards you can check.</p></li>'
      + '</ol></section>'

      + '<section class="section" aria-labelledby="h-earn"><div class="section-head"><h2 id="h-earn">How creators earn</h2><a href="#economy" data-nav="economy">Full economy</a></div><div class="earn">'
      + '<div class="panel stack"><p class="eyebrow">Someone collects a remix of a remix for 1 SOL</p>'
      + '<div class="splitbar" role="img" aria-label="' + esc(seg.map(([, l, b]) => l + ' ' + pct(b)).join(', ')) + '">' + seg.map(([k, , b]) => '<i class="seg-' + k + '" style="flex:' + b + '"></i>').join('') + '</div>'
      + '<ul class="legend">' + seg.map(([k, l, b]) => '<li><i class="seg-' + k + '" aria-hidden="true"></i><span>' + esc(l) + '</span><b class="num">' + solOf(b) + ' SOL</b></li>').join('') + '</ul>'
      + '<p class="muted">An original game keeps ' + pct(10000 - R.FEE_BPS) + '. Tips go 100% to the creator.</p></div>'
      + '<ul class="earn-list">'
      + '<li><b>Collects</b><span>Fans pay to own a numbered edition. The game stays free to play for everyone.</span></li>'
      + '<li><b>Tips</b><span>Players can tip any creator, and the whole tip goes to them.</span></li>'
      + '<li><b>Remix royalties</b><span>' + pct(R.PARENT_BPS) + ' of a remix’s collects goes to the original creator and ' + pct(R.GRAND_BPS) + ' to the one before.</span></li>'
      + '<li><b>Weekly rewards</b><span>' + Math.round(R.CREATOR_SHARE * 100) + '% of each week’s GPLY goes to creators, by unique players. ' + Math.round(R.PLAYER_SHARE * 100) + '% goes to players, by leaderboard places.</span></li>'
      + '<li><b>Sparks</b><span>' + R.SPARKS_PER_PLAYER + ' Sparks for each new player of your game, up to ' + R.SPARKS_PLAYER_CAP + ' players per game.</span></li>'
      + '</ul></div><p class="fine">' + (MAINNET ? 'Collects, tips and royalties are paid in real SOL straight to your wallet. GPLY rewards are points with no cash value.' : 'On devnet these are test balances. Real payouts start at mainnet beta, after a security audit.') + '</p></section>'

      + '<section class="section" aria-labelledby="h-compare"><div class="section-head"><h2 id="h-compare">ClaudePlay and Google Labs Playground</h2>'
      + '<p class="muted">Google Labs launched Playground on October 7, 2026. Here is how the two compare.</p></div>'
      + '<div class="table-scroll">' + specTable() + '</div>'
      + '<p class="fine">Playground details as reported in October 2026: ' + PLAYGROUND_SOURCES.map(([n, u]) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(n) + '</a>').join(', ') + '.</p></section>'

      + '<section class="section access" aria-labelledby="h-access"><div class="access-intro"><h2 class="h2" id="h-access">Built for every player</h2>'
      + '<p class="muted">These settings work across the site and inside every game.</p><button class="btn" type="button" data-act="settings">Open accessibility settings</button></div><ul class="feature-grid">'
      + '<li><b>Assist mode</b><span>Slow any game to 75% or 50% speed. Assisted runs count as personal results and stay off ranked leaderboards.</span></li>'
      + '<li><b>One-button friendly</b><span>Runner and Flapper play with a single key or tap. Every kit works with keyboard, touch or mouse.</span></li>'
      + '<li><b>Calm motion</b><span>Turn off screen shake and page animations, or follow your device’s reduced-motion setting.</span></li>'
      + '<li><b>High contrast, larger text</b><span>A black-and-yellow high-contrast theme and three text sizes.</span></li>'
      + '<li><b>Screen reader support</b><span>Labeled controls, focus that moves to each new page, and a spoken score when a run ends.</span></li>'
      + '<li><b>Light on data</b><span>One small page with no tracking scripts. Games are single files you can download and play offline.</span></li>'
      + '</ul></section>'

      + '<section class="section" aria-labelledby="h-road"><div class="section-head"><h2 id="h-road">Roadmap</h2>'
      + '<p class="muted">Fun first, money second, the token last. Each stage opens when the checkpoint before it is met, not on a date.</p></div><ol class="road">'
      + ROADMAP.map((s) => '<li class="stage' + (s.now ? ' now' : '') + '"><div class="stage-top">' + (s.now ? '<span class="chip accent">We are here</span>' : '') + '</div><b>' + esc(s.name) + '</b><p>' + esc(s.what) + '</p>' + (s.gate ? '<p class="gate"><span>Checkpoint</span>' + esc(s.gate) + '</p>' : '') + '</li>').join('')
      + '</ol></section>'

      + '<section class="section" aria-labelledby="h-faq"><div class="section-head"><h2 id="h-faq">Questions</h2></div><div class="faq">'
      + FAQ.map(([q, a]) => '<details><summary>' + esc(q) + '</summary><p>' + esc(a) + '</p></details>').join('')
      + '</div></section>';
  }
  function mountHome() {
    unmountPlayer('home-screen');
    $('#view').innerHTML = homeHTML() + footHTML();
    wakeMascot($('#home-mascot'));
    revealShelf($('#home-shelf'));
    const host = $('#home-screen');
    const hero = S.starters.find((s) => s.gid === 'kit-neon-dash');
    if (!host || !hero) return;
    mountPlayer(host, hero.code, {
      title: 'Neon Dash, a playable runner game',
      onStart: () => recordPlay(hero.gid).catch(() => {}),
      onMessage: (d, p) => { if (d.t === 'over') onGameOver(hero.gid, d, p).catch((e) => toast(e.message, 'bad')); },
    });
  }

  function wakeMascot(img) {
    if (!img || !SITE.mascot || calmNow()) return;
    const anim = new Image();
    anim.onload = () => { if (img.isConnected && !calmNow()) img.src = anim.src; };
    anim.src = SITE.mascot;
  }
  // Stickers on a sheet slap down in turn the first time they scroll into view.
  function revealShelf(root) {
    if (!root || calmNow() || !('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver((list) => list.forEach((e) => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      e.target.style.setProperty('--i', String([...e.target.parentElement.children].indexOf(e.target) % 8));
      e.target.classList.add('in');
    }), { rootMargin: '0px 0px -8% 0px' });
    [...root.children].forEach((c) => io.observe(c));
  }
  function updateHome() { const s = $('#home-shelf'); if (s) s.innerHTML = homeShelf(); }

  /* ---------- business: services for brands, communities and schools ---------- */
  const BIZ_DEMO = { title: 'Kape Dash', palette: 'custom', colors: { bg: '#2b1a12', main: '#f2c48d', alt: '#d9480f' }, shape: 'orb' };
  const OFFERS = [
    { name: 'Branded mini-game', who: 'For shops, brands and events', items: ['Your colors, name and prize in a game kit, or a custom game', 'One link that opens on any phone', 'A leaderboard and a results summary at the end'] },
    { name: 'Playable quest', who: 'For crypto projects and online communities', items: ['A game built around your project', 'Wallet-signed scores tied to the exact game file', 'A verified winners list, and you send the rewards from your own wallet'] },
    { name: 'Game-making workshop', who: 'For schools, bootcamps and team events', items: ['Everyone makes and publishes a game in one session', 'Kits for beginners and the AI studio for advanced groups', 'A class arcade that keeps everyone’s games'] },
  ];
  function contactHTML() {
    const c = String(SITE.contact || '').trim();
    if (!c) return '';
    if (/^https:\/\//i.test(c)) return '<a class="btn big" href="' + esc(c) + '" target="_blank" rel="noopener">Talk to us</a>';
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) return '<span class="contact">Email us at <b class="mono" id="contact-addr">' + esc(c) + '</b><button class="btn small ghost" type="button" data-act="copy-contact">Copy</button></span>';
    return '';
  }
  function bizHTML() {
    const contact = contactHTML();
    return '<section class="hero biz" aria-labelledby="biz-title"><div class="hero-copy">'
      + '<h1 class="page-title" id="biz-title">Games your audience plays from a link</h1>'
      + '<p class="lede">We build branded mini-games for brands, crypto communities and classrooms. Players need no app and no sign-up, and you get a leaderboard you can check.</p>'
      + '<div class="row cta"><button class="btn primary big" type="button" data-act="brand-demo">Make a branded demo</button>' + contact + '</div>'
      + '<p class="fine">The demo takes about a minute: pick your colors, rename the game and play it.</p></div>'
      + '<figure class="console">'
      + '<div class="screen" id="biz-screen"></div>'
      + '<figcaption class="console-cap"><span><b>' + esc(BIZ_DEMO.title) + '</b> · A branded runner for a made-up coffee shop, in its own colors.</span></figcaption></figure></section>'

      + '<section class="section" aria-labelledby="h-offers"><div class="section-head"><h2 id="h-offers">What we build</h2></div><div class="ways">'
      + OFFERS.map((o) => '<article class="way"><p class="eyebrow">' + esc(o.who) + '</p><h3>' + esc(o.name) + '</h3><ul class="ticks small">' + o.items.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></article>').join('')
      + '</div></section>'

      + '<section class="section" aria-labelledby="h-process"><div class="section-head"><h2 id="h-process">How a project runs</h2></div><ol class="steps">'
      + '<li><b>Brief</b><p>Tell us who will play, what you want them to do and what they can win.</p></li>'
      + '<li><b>Prototype</b><p>Play a first version in your colors and ask for changes.</p></li>'
      + '<li><b>Launch</b><p>Share one link. Players start with a tap, on any device.</p></li>'
      + '<li><b>Results</b><p>Get the leaderboard, the winners list and play counts.</p></li>'
      + '</ol></section>'

      + '<section class="section" aria-labelledby="h-why"><div class="section-head"><h2 id="h-why">Why it works for campaigns</h2></div><ul class="feature-grid">'
      + '<li><b>Nothing to install</b><span>No app and no sign-up, so people start playing as soon as they open the link.</span></li>'
      + '<li><b>Scores you can check</b><span>Each score is signed and tied to the exact game file, with a seed and input log for spot checks.</span></li>'
      + '<li><b>You keep the game</b><span>It is one HTML file. Host it on your own site, or keep it on ClaudePlay.</span></li>'
      + '<li><b>Accessible by default</b><span>Assist mode, keyboard play, high contrast and larger text are built in.</span></li>'
