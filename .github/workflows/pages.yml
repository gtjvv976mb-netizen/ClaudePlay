name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node build.mjs
        env:
          GP_CONTACT: ${{ vars.GP_CONTACT }}
      - name: Unit tests
        run: node test/core.test.mjs
      - name: Solana payment tests
        run: node test/solana.test.mjs
      - name: AI server tests
        run: node test/server.test.mjs
      - name: Persistent AI budget tests
        run: node test/budget-store.test.mjs
      - name: Sponsored AI integration tests
        run: node --test test/sponsored.test.mjs
      - name: Check that GitHub Pages is set to deploy from Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The site was built but not published. Turn on GitHub Pages in Settings > Pages with Source set to GitHub Actions, then run this workflow again."
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist/site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
